# A whitelist preset: only the rows below exist, and nothing here delegates.
#
# It is the ceiling for any session that must stay inside a reviewed tool set —
# the tools a session may ever expose are the ones mounted here, narrowed
# further per session by the host (tool filters and restrictions). It is built
# up from a short list instead of being copied from `standard` and pruned, so a
# row added to `standard` upstream never reaches a session by default.
#
# Deliberately absent, and to stay absent: every delegation, workflow and agent
# control row (`subagent`, `subagent_fork`, `workflow`, `ralph`, `send_message`,
# `list_agents`, job control), plan mode, goals, and `skill-filesystem`.
# Delegation is the one escape a tool filter cannot close: a row that installs
# per agent lands in the session's OWN scope, outside every inherited filter,
# and lets the session hand its work to a descendant with a wider surface.
# Keeping those rows out of the preset is what makes the ceiling real.
#
# Same plane rules as the `standard` preset: a service row would need an
# `isolate` realm; every row below only registers model-facing tools.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a coding agent powered by the {{model}} model.
    suffix: >-
      Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── skills ──────────────────────────────────────────────────────────────────

# `skill-filesystem` is deliberately not loaded: it would make every globally
# installed Skill discoverable. The catalog and loader stay, so the host can
# publish an explicit allowlist through its own scoped provider.
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

# Long-lived sessions compact their own history. `tokenMeter` stays on the host
# plane, as in `standard`.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── web ─────────────────────────────────────────────────────────────────────

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. `fetch` stays off: search only.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
