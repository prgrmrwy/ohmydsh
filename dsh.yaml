# mydsh 总配置 — DSH 定制的唯一开关面。
# 修改后运行 `dsh build`(或 `node scripts/sync.mjs`)物化到 ~/.dsh。
# 约定:禁用(enabled: false)≠删除;手改一律回写本仓库。

dshVersion: 0.1.0-rc.6     # 启动脚本 bin/dsh 运行时读取,单一版本来源

bundlesBrief:              # 出厂 bundle 的短备注(非 manifest 管理的包)
  "@deepseek-ai/dsh-base": 核心 bundle(agent / 会话 / 工具骨架)
  "@deepseek-ai/dsh-web-app": web 壳(浏览器 UI)

customizations:
  # 字段约定:brief = 启动清单里的短备注(优先于 note);note = 完整来源/审查记录
  # 第三方(remote):只存 pin + 覆盖 + 记录,不 vendor 源码
  - id: cost-meter
    type: package
    source: remote
    spec: dsh-cost-meter@1.5.6
    version: 1.5.6
    enabled: true
    brief: 会话费用统计
    note: 会话费用统计(web client 插件);仓库 https://github.com/Han-1413141/dsh-cost-meter;依赖拉到 rc.7 家族,重启后验证加载
  - id: modlens
    type: package
    source: remote
    spec: '@liustack/modlens@3.21.0'
    version: 3.21.0
    enabled: true
    brief: 支持图片识别(粘贴即视觉,走 Codex)
    note: B006 生态解:粘贴图片即视觉(web client + modlens_read_image 工具 + 模型选择器 vision 条目);repo https://github.com/liustack/modlens(3.1k stars,MIT,活跃);引擎策略:仅 codex(OpenAI 产品 CLI,二进制 codex),claude 显式禁用(reuse.claude=false);实测真实读图成功(33.8s,计 Codex 额度);需重启生效
  - id: archify-dsh
    type: package
    source: remote
    spec: '@tt-a1i/archify-dsh@0.1.0'
    version: 0.1.0
    enabled: true
    brief: 架构图 skill(架构/时序/数据流/生命周期)
    note: repo https://github.com/tt-a1i/archify(14.2k stars,MIT,活跃);skill-only bundle,对话内生成可交互架构图(自包含 HTML/PNG/SVG);后续可配合 B001 架构师角色;需重启生效
  # 自研 skill:添加远端插件的标准流程
  - id: add-dsh-plugin
    type: skill
    enabled: true
  # 自研 skill:移除插件的标准流程
  - id: remove-dsh-plugin
    type: skill
    enabled: true
