    note: 'B015;repo https://github.com/prgrmrwy/dsh-cockpit(MIT,自研);web client cordis bundle。**0.3.0(2026-09-05 升级,change dsh-0-1-2-host-api-migration 收尾 / cockpit 仓库 change adapt-dsh-012-typert-gateway 产物;发布物核对:version 0.3.0、inject 已换为 dsh-api-session-controller + dsh-client-ui-session、peer 仅 cordis ^4.0.1、lib/client.js 含 pendingInteractions 订阅)**:① 适配 DSH 0.1.2 —— 旧 inject 声明的 dsh-client-runtime 在 0.1.2 线被上游移除,0.2.1 在新运行体上 loader 解析不到依赖而**永不激活**(静默),0.3.0 改声明实际承接包;② 新增职责 —— 订阅官方 uiSession.pendingInteractions,把当前完整 {sessionId,kind,key} 快照经既有 capability 通道上报驾驶舱(typert 设备的顶栏待审批/提问计数**唯一来源**,cockpit 侧 evidence 已实测 requested→计数升、resolved→归零、无 bridge 时显示「不可观测」而非 0);只传最小标识,不读交互内容,不注册决策监听,host 半区仍为 no-op。历史:0.2.1(2026-09-04 审查,逐字节 diff 0.2.0→0.2.1 的 lib/client.js):① capability 失效自愈——capability 是 TTL 60s 的短期凭据,新增 readErrorCode 解析驳回响应体的结构化 code,把 401 与「400 + bridge-capability-invalid」统一判为 capability 失效(isCapabilityFailure),此时重置 helloReady 并向父页面 postMessage {type:"dsh-cockpit:capability-expired"} 主动请求换发,换发前 outbox 条目保留不丢;② 纯续签不再重申 current——0.2.0 收到同源 bridge-config 时无条件 helloReady=false,使驾驶舱每次续发配置都触发重新 hello 并重报当前会话(可能误清刚 re-arm 的绿点),0.2.1 删除该行,仅在真正的设备重新激活路径上重置;peer 仍为 @deepseek-ai/dsh-client-runtime ^0.1.1-rc.2(对运行体 0.1.1-rc.2 满足;该包在 0.1.2 线被上游移除,故本条目也是阶段四的回归对象);发布物含 lib/index.js(host no-op 入口)与 lib/client.js,main 指向存在的文件。0.2.0 协议 v2 重构:选择时立即捕获 ID 入有界去重 outbox(不再等 250ms debounce 定时器触发才重读 current,快速连续切换/打开后立即归档不再丢确认);outbox 项只在驾驶舱明确 2xx 后移除,网络异常/401/其它非 2xx 均保留并按有上限指数退避重试,由新选择/设备重新激活/成功 hello 触发;实际 Cockpit origin 与短期认证 capability 由父页面 postMessage 握手动态提供(不再固定 127.0.0.1:3090),适配任意 COCKPIT_PORT;驾驶舱按请求 Origin 匹配设备,按 sessionId 精确清除完成绿点且保留 re-arm(官方 select 语义的驾驶舱侧观察);驾驶舱同步升级后仍兼容旧协议(无 capability header)请求走既有 cookie 认证;只传 sessionId 与协议元数据,不碰内容/settings/凭据/provider token;驾驶舱不可达静默降级并重试,不影响原生 DSH 工作台;每台接驾驶舱的机器都装,需搭配驾驶舱同步升级到对应版本才能拿到可靠协议,否则仍按旧协议尽力而为工作(顶栏链条图标只表示插件装没装,不表示协议版本或连接新鲜度)。⚠ 必须 ≥0.1.1:v0.1.0 发布物缺 lib/index.js 而 package.json main 指向它、cordis.patch.yml 又把它插进 bundle 栈,导致装了该插件的设备 DSH 启动即崩(plugin tree failed to load / ERR_MODULE_NOT_FOUND),不是功能降级而是完全无法启动;0.1.1 补了 no-op host 入口(纯浏览器插件同样需要 loader entry 才能被 client-modules scanner 服务浏览器包)并让 tsdown 同时构建 host/client 两个半区'
