# ohmydsh 总配置 — DSH 定制的唯一开关面。
# 修改后运行 `dsh build`(或 `node scripts/sync.mjs`)物化到 ~/.dsh。
# 约定:禁用(enabled: false)≠删除;手改一律回写本仓库。

dshVersion: 0.1.1-rc.2     # 启动脚本 bin/dsh 运行时读取,单一版本来源

autoUpdate:                # 启动/构建前自动检测并升级 DSH 版本(channel = registry dist-tag)
  enabled: true            # 逃生门:false 或 env DSH_SKIP_UPDATE=1 完全跳过检测(可钉在旧版)
  channel: latest          # 追踪频道:latest / next;env DSH_UPDATE_CHANNEL 可临时覆盖(优先级最高)

web:                       # Web 启动形态(非 customization;sync 直接渲染进 profile patch)
  lan: false               # 保持关闭。跨机器访问统一走 SSH 隧道,不做明文局域网直连。
                           # ⚠ 开启会绑 0.0.0.0,把完整 agent 能力(bash/文件读写)暴露到局域网,
                           #   且 DSH 无 TLS——明文传输可被同网嗅探。2026-08-24 决策:不使用该形态。
                           # 远端访问方式:另一台机器 `ssh -N -L 3080:127.0.0.1:3080 user@<本机IP>`,
                           #   浏览器开 http://127.0.0.1:3080(公钥免登 + SSH 加密 + 回环即 secure context)。
                           #   用法见 docs/notes/lan-access-ssh-tunnel.md
                           # ⚠ DSH_LAN=1 环境变量优先级高于本开关,同样不要设置。

agentInstructions:          # DSH 原生工作环境级指令,单例物化为 $DSH_HOME/AGENTS.md
  enabled: true
  source: instructions/dsh-home.md

bundlesBrief:              # 出厂 bundle 的短备注(非 manifest 管理的包)
  "@deepseek-ai/dsh-base": 核心 bundle(agent / 会话 / 工具骨架)
  "@deepseek-ai/dsh-web-app": web 壳(浏览器 UI)

customizations:
  # 字段约定:brief = 启动清单里的短备注(优先于 note);note = 完整来源/审查记录;
  #          name = 非 npm spec(github/tarball)时的真实包名(必填;npm spec 可省略)
  # 第三方(remote):只存 pin + 覆盖 + 记录,不 vendor 源码
  - id: cost-meter
    type: package
    source: remote
    spec: dsh-cost-meter@1.5.42
    version: 1.5.42
      # [2026-08-24] plugin-update: cost-meter 1.5.35 -> 1.5.42(release notes 见 registry;审查记录请补进 note)
    enabled: true
    brief: 会话费用统计
    note: '会话费用统计(web client 插件);仓库 https://github.com/Han-1413141/dsh-cost-meter;1.5.35(2026-08-21 审查):v1.5.34 为 dsh 0.1.1-rc.x 适配(修复 rc.2 下费用展示丢失),v1.5.32 内置 DeepSeek-V4-Flash-Vision-Exp 计价,v1.5.35 修正未命中模型列表口径;升级后需重启验证加载与展示'
  - id: archify-dsh
    type: package
    source: remote
    spec: '@tt-a1i/archify-dsh@0.1.0'
    version: 0.1.0
    enabled: true
    brief: 架构图 skill(架构/时序/数据流/生命周期)
    note: repo https://github.com/tt-a1i/archify(14.2k stars,MIT,活跃);skill-only bundle,对话内生成可交互架构图(自包含 HTML/PNG/SVG);后续可配合 B001 架构师角色;需重启生效
  # 自研(local):首页空白会话首发启动到隔离 Git worktree；验收前保持禁用。
  - id: worktree-session
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: Worktree Session 首发隔离(task branch/lean deps/独立 build home)
    note: '自研 Host+Web bundle；从 base 在首次普通发送时创建唯一 ws/* branch 与 .worktrees/* checkout，不切换主 checkout；npm lean/mutable、.env.local ignored-only 同步、隔离开发 DSH_HOME、安全 status/promote/clean；交互与 Git 探测概念参考 https://github.com/LaoYueHanNi/dsh-git-worktree (MIT，详见 packages/worktree-session/NOTICE)'
  # 自研(local):B013 sidebar 会话行前动态 provider logo
  - id: sidebar-session-provider-icon
    type: package
    source: local
    version: 0.1.2
    enabled: true
    brief: 侧边栏会话行当前选中模型品牌 logo(选择器即时切换)
    note: 'B013 落地;openspec change sidebar-session-provider-icon;Web client 订阅官方 modelDirectories per-session store,输入框模型切换成功即更新 logo;host provider projection 仅作未打开历史会话 fallback;品牌 SVG 下载落盘(DeepSeek/OpenAI/OpenCode/Anthropic/Grok/Kimi/GLM/MiniMax/Pi/OpenClaw/Hermes),不手绘;轻量 DOM 注入 + row-locator 单模块,不触碰官方 StateDot/时间/菜单/拖拽;未知选择首字母 fallback'
  - id: ws
    type: skill
    enabled: true
  # 自研 skill:添加远端插件的标准流程
  - id: add-dsh-plugin
    type: skill
    enabled: true
  # 自研 skill:移除插件的标准流程
  - id: remove-dsh-plugin
    type: skill
    enabled: true
  # 自研 skill:沙箱/权限升级避坑(sandbox_permissions 正确用法 + core 缺陷绕过)
  - id: dsh-sandbox-notes
    type: skill
    enabled: true
  # 自研 skill:B015 跨机器访问 — 客户端 SSH 隧道(公钥免登 + 端口占用自动退避 + 附脚本)
  - id: dsh-tunnel
    type: skill
    enabled: true
  # 第三方(remote):B003 IDE 集成 — workspace 菜单一键在 VSCode 打开
  - id: open-in-vscode
    type: package
    source: remote
    spec: 'https://github.com/omdsh-dev/dsh-open-in-vscode/archive/refs/tags/v0.1.6.tar.gz'
    name: dsh-open-in-vscode
    version: 0.1.6
    enabled: true
    brief: 工作区菜单「在 VSCode 中打开」
    note: B003 落地;npm 0.2.0 已 unpublished,按官方 README 建议用 tag v0.1.6 的 tarball 直装(不跑 git prepare);MIT,50 stars,2026-08-16 活跃;host 行 dsh-open-in-vscode(typert 服务 openInVscode/open,用户点击时 spawn 编辑器 CLI)+ web client(workspace 行菜单,rc.6 走兼容适配器),无工具/无模型可见面;前置:本机装了 VS Code CLI(code),详见 https://github.com/omdsh-dev/dsh-open-in-vscode
  # B004 扩展:订阅制主对话 provider — codex / claude / grok OAuth 登录后出现在输入框模型选择器(免 api-key)
  - id: llm-subscriptions
    type: package
    source: remote
    spec: dsh-plugin-subscriptions@0.5.2
    version: 0.5.2
    enabled: true
    brief: codex/claude/grok 订阅制 provider(Claude 复用本机登录态,输入框可切换)
    note: 'B004 扩展(订阅制主对话,非委派);每次升级先读 change openspec/changes/2026-08-20-llm-subscriptions-upgrade(含 ADR-0001 选型);repo https://github.com/V1ki/dsh-plugin-subscriptions(MIT,158 stars,活跃,每日提交);功能:设置页 Subscriptions 页登录 ChatGPT(Codex)/ Claude / Grok(X Premium),登录后出现在会话模型选择器(/model 分组),live 模型目录(codex 走 chatgpt.com/backend-api/codex/models、claude 走 api.anthropic.com/v1/models 带 thinking/effort),附用量卡片 / Effort 选择器 / Speed 选择器 / image_generate / x_search;0.4.2 关键变化(2026-08-20 diff 0.3.1→0.4.2 源码核对):① claude 登录默认「导入本机 Claude Code 凭据」— macOS keychain(服务名 "Claude Code-credentials")→ 失败回退 ~/.claude/.credentials.json(尊重 CLAUDE_CONFIG_DIR),命中即秒登录不弹浏览器,无凭据时报"Run claude first";刷新后写回 CLI 凭据库(stale-blob 乐观并发校验,与 claude CLI 共享同账号不打架)② OAuth 底层改用 claude.com/cai/oauth/authorize + 固定回调 platform.claude.com/oauth/code/callback(旧 claude.ai/oauth/authorize 已废弃 → 修复 0.3.1 authorization failed)③ 新增 providerRetryPolicy(1s→60s 指数退避)与 execFileSync 探测 claude --version(⚠ 信任面变化:0.3.1 的"无 child_process"对 0.4.2 不成立,本条目由 2026-08-20 审查确认);路由 id(codex/claude/grok)未变 → subscriptions-sandbox-shim 与既有 codex 会话(auth.json)兼容;peer 仍 ^0.1.0-rc.5(兼容 rc.7 解析);风险:订阅自动化 ToS/封号(与网页版同级),config.providers 可只留 codex/claude;grok 不登录即不出现。0.5.0(2026-08-22 diff 0.4.2→0.5.0 升级):路由 id 未变、登录/凭据面未变;新增 Speed 档位(speed/setSpeed RPC,standard/fast)与 web-app rc.8 vendor 图库(ImageGallery);claude User-Agent 改惰性计算(行为不变)。0.5.2(2026-08-24 diff 0.5.0→0.5.2:commits 0f9c3307→958a236f→08b9b7cc 核对):**① claude prompt caching 完整落地(PR #25,closed #24;0.5.0 的 claude 路由从不发 cache_control → 每轮全价重放 tools/system/全部历史,订阅 5h 窗口烧速远高于 CLI——本机 8/20-8/24 实测 32.1M/日全价 input、cost-meter cacheRead=0,升级后应见 cacheRead>0)**:translate/anthropic.ts 新增 markMessageCache(前缀断点 + 会话尾部 ephemeral 断点),配套 fix(claude) 按名排序 tools 保证缓存前缀稳定、保留中段 system 消息;② Claude OAuth fallback(本机无 CLI 凭据时走交互登录,PR #10);③ 新增 GitHub Copilot provider(设备码登录,PR #13/#26,默认未登录不出现);④ HTTP(S) proxy 支持(PR #33);⑤ peer 依赖 bump 至 0.1.1-rc.2(对运行体 0.1.1-rc.2 满足);路由 id(codex/claude/grok)未变 → shim 兼容;风险与 0.5.0 同(ToS/封号),config.providers 建议只留 codex/claude'
  # 自研(local):D001/issue #7 + Codex Responses 孤立 function_call 部署侧缓解
  - id: subscriptions-sandbox-shim
    type: package
    source: local
    version: 0.1.1
    enabled: true
    brief: 订阅 provider 工具面 sandbox 字段与 Responses 历史配对清洗(shim)
    note: 'D001/upstream https://github.com/V1ki/dsh-plugin-subscriptions/issues/7 部署侧缓解;适配器边界两层剥离(schema 出站 + arguments 入站),并清理中断 subagent settlement notice 注入父会话的孤立 tool-call(避免 Codex No tool output found HTTP 400);默认只作用 codex/grok,配置见 packages/subscriptions-sandbox-shim/README.md;⚠ sandbox 字段剥离仅限 danger-full-access + approval: never 部署,受限部署(read-only/workspace-write + ask)必须 enabled: false(合法升级通道会被误剥);上游修复后按 manifest 删除移除'
  # 第三方(remote):归档会话查看/恢复 — 官方只有 archiveSession 无 unarchive(上游 Discussion #2613 已知缺口)
  - id: ui-archive-manager
    type: package
    source: remote
    spec: '@tangzai/dsh-ui-archive-manager@0.1.1'
    version: 0.1.1
    enabled: true
    brief: 归档会话查看与恢复(设置页「归档管理」)
    note: 'repo https://github.com/Neumannzc/dsh-archive-manager(MIT);用途:设置 → 归档管理,按工作区列出已归档会话,一键取消归档回侧边栏继续原会话;审查(2026-08-19):host 端幂等补丁 WorkspaceRegistry.unarchiveSession(官方未来提供则让位),unarchive 走 registry 自身 enqueueOperation/requireState/setState 状态路径,经官方 archived-sessions-changed 帧广播;webServer 路由带信任防护(Host fence 防 DNS rebinding + Origin 校验 + 8KiB body cap);无删除/破坏性功能;仅 react peer;本地 clone 验证 typecheck + 17 单测 + build 全过(CI 红叉仅为 pnpm 忽略 esbuild 构建脚本的环境问题);⚠ TRUSTED_HOSTS 默认空 → 仅限 loopback(127.0.0.1/localhost),开启 web.lan 需源码加 trustedHosts;DSH 升级后需回归验证'
  - id: width-tiers
    type: package
    source: remote
    spec: dsh-width-tiers@1.0.3
    version: 1.0.3
      # [2026-08-24] plugin-update: width-tiers 1.0.2 -> 1.0.3(release notes 见 registry;审查记录请补进 note)
    enabled: true
    brief: 对话区宽度五档切换(748px 至全宽)
    note: 'repo https://github.com/aaronlei/dsh-width-tiers(MIT);用途:Web 对话区标准/中等/宽/超宽/全宽五档切换并以 localStorage 记忆;审查(2026-08-20 npm 1.0.2 精确包):host 入口为空操作,client 仅注入 layout/locale,通过 --dsh-chat-content-width 行内覆盖调整宽度,不依赖构建哈希类名;无网络请求、Host 文件/命令/模型能力,生命周期 disposer 会清理 DOM、监听器、定时器与样式;注意非标准档会主动关闭详情面板,全宽档会经官方 layout 服务收起侧边栏;依赖 DSH Web rc.x 客户端布局与 locale 服务,升级后需回归验证'
  # dsh-width-tiers 没有 dsh.bundle,需显式 loader 行让 client scanner 发现浏览器半区。
  - id: width-tiers-wiring
    type: patch
    enabled: true
    brief: 对话宽度插件 Web 加载接线
  # 第三方(remote):B007 侧问答 — better-sidebar 侧边栏框架 + sidebar-qa 划选追问(压缩策略省 token)
  - id: better-sidebar
    type: package
    source: remote
    spec: dsh-better-sidebar@0.16.0
    version: 0.16.0
      # [2026-08-24] plugin-update: better-sidebar 0.15.2 -> 0.16.0(release notes 见 registry;审查记录请补进 note)
    enabled: true
    brief: 服务化侧边栏工作台框架(sidebar-qa 的前置依赖)
    note: 'B007/sidebar-qa 前置;repo https://github.com/omdsh-dev/DSH-better-sidebar(MIT,2026-08-24 摘要审查);重型框架:右侧栏+底部面板双工作台(ctx.betterSidebar.registerTab 开放给生态,28+ 插件),内置文件管理/内嵌浏览器/真实终端(node-pty)/Git 面板/后台任务/侧边对话(beta,完整上下文继承=费 token 形态,可设置关闭);README 官宣支持 DSH 0.1.0-rc.8 / 0.1.1-rc.1 / 0.1.1-rc.2,peer ^0.1.0-rc.8 对运行体 0.1.1-rc.2 满足;信任面:终端/浏览器/可选工具注入(terminal_* / sidebar_open,默认关闭),比轻量插件重得多;仅为 sidebar-qa 引入,接入后只开所需 tab;部署侧信任决定(2026-08-24):profile pnpm `allowBuilds.node-pty: true` 已批准其原生构建脚本,否则安装被 ERR_PNPM_IGNORED_BUILDS 挡下'
  - id: sidebar-qa
    type: package
    source: remote
    spec: dsh-sidebar-qa@0.4.0
    version: 0.4.0
    enabled: true
    brief: 划选即问侧边栏问答(压缩上下文,省 token)
    note: 'B007 终选(替代 dsh-air:fork 全量继承费 token,codex 订阅无缓存保障);repo https://github.com/ChenRuoT/dsh-sidebar-qa(MIT,2026-08-24 README+发布物审查);划选文本→「提问」→侧边栏内嵌问答,独立会话(❓<主题>)不中断主对话;三种上下文策略=全量继承(fork+前缀缓存)/压缩(快速模型压旧历史+近期原文,默认)/机械裁切(定长窗口),默认 compressed 解决侧问费 token 痛点;嵌套追问+追问记录树(归档/删除置灰);依赖 dsh-better-sidebar ^0.14.0(同批入 manifest);peer rc.8 系对运行体 0.1.1-rc.2 满足'
