    note: 'B013 落地;openspec change sidebar-session-provider-icon;Web client 订阅官方 modelDirectories per-session store,输入框模型切换成功即更新 logo;host provider projection 仅作未打开历史会话 fallback;品牌 SVG 下载落盘(DeepSeek/OpenAI/OpenCode/Anthropic/Grok/Kimi/GLM/MiniMax/Pi/OpenClaw/Hermes),不手绘;轻量 DOM 注入 + row-locator 单模块,不触碰官方 StateDot/时间/菜单/拖拽;未知选择首字母 fallback'
  # 自研(local):B018 会话标题旁 session id 短标识徽标(点击复制完整 id)
  - id: session-title-copy
    type: package
    source: local
    version: 0.1.2
    enabled: true
    brief: 标题右侧 6 位 session id 徽标(点击复制完整 id + toast;标题恢复官方)
    note: 'B018 落地 + 实机修订;openspec change session-title-id-badge;Web client 订阅官方 sessions list(current 为 id 真相源,cockpit-bridge 同 seam);标题旁插入自建徽标(去 session- 前缀取前 6 位,如 9af69b),hover tooltip 完整 id,点击复制完整 id + 瞬态提示;0.1.0 的标题点击复制已移除——标题恢复官方 disabled 原样;MutationObserver + sessions 订阅 rAF 防抖幂等 reconcile;DOM 结构知识单文件 title-locator;祖先面包屑打开行为不变;无 host 能力/无网络请求;定位失败/剪贴板拒绝安全降级'
  # 自研(local):B019 设置面板底部 DSH 主机系统时钟(24 小时制 + 时区)
  - id: system-clock
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 设置面板底部 DSH 主机系统时钟(24h + 时区 + hostname)
    note: 'B019 落地;openspec change settings-system-clock + dsh-0-1-2-host-api-migration;Host+Web bundle:host 经通用 connection RPC 通道 /dsh-system-clock 暴露只读 now 采样(主机 epoch / IANA 时区 / UTC 偏移 / hostname);web 注册官方 settings.section(id system-clock,order 300→设置导航最底部),一次采样 + skew 引擎本地每秒 tick,Intl timeZone + hour12:false 渲染,DST 正确;60s 周期 + visibilitychange 重同步;采样不可达显式降级,不静默回退浏览器时间;只读、零配置、无外部网络外呼。⚠ 回环边界的表达方式随运行体变更(2026-09-05,change dsh-0-1-2-host-api-migration):`0.1.1-rc.2` 由注册时显式传入 `{authority:''loopback''}` 逐 channel 限定;`0.1.2` 线删除了该注册参数,改由 connection 层对**每个** channel 统一施加 Host fence(Host 非 loopback 且不在 `trustedHosts` 内即 403)加浏览器会话认证(未认证 401)。本部署未配置 `trustedHosts`,故边界与旧版等价且更严(两道)。**已实测**:LAN IP / 伪造域名 Host 一律 403,携带有效 cookie 也仍 403(fence 先于认证);回环+已认证才返回采样。⚠ 若将来给 profile 配置 `trustedHosts`,本 channel 会随之放宽——那是一次显式安全决策,不得顺手添加'
  # 自研(local):受限地区 × Claude 发送拦截(Web blocks + Host 出口国家码判定,双备份 Geo,未知 fail-closed)
  - id: home-network-model-guard
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 出口位于受限地区时禁用 Claude 系列模型发送(输入框禁用 + 原因文案)
    note: 'openspec change block-claude-on-home-network 归档后更新为 trusted-egress-claude-guard,运行体迁移见 dsh-0-1-2-host-api-migration;openspec change fix-geo-timeout-budget-starvation 修复主备共享超时预算导致的假 unknown(实机 2026-09-04 误杀 84min/351 步 turn,出口实为 US、两端点均 200):timeoutMs 语义由整次判定预算改为**单端点**预算(默认 5s,最坏整体约 2×),每端点经 AbortSignal.any 组合调用方信号独享预算,慢主端点不再剥夺备端点尝试机会;单端点预算内对瞬时失败(transport/非 2xx)至多重试 1 次(150ms 退避),端点自身超时与确定性坏响应(非 JSON/无 country)不重试;失败归因由 geo 层上行(timeout/invalid-response/fetch-failed),network 层不再靠错误文本正则猜测;llm/stream gate 拒绝时在**根上下文**输出去重诊断日志(仅分类+降级原因,与 RPC 路径 logTransition 独立计数)——此前拒绝完全静默,故障只能靠解压 session 日志反推;fail-closed 语义未放宽,双端点均失败仍判 unknown;Host+Web bundle:host 经 connection RPC /dsh-home-network-model-guard(仅回环可达,表达方式见 system-clock 条目)提供出口判定(两个互为备份的 HTTPS Geo 服务读国家码:主失败切备,双失败 unknown 且指数退避持续重试 2s→60s;blockedCountries 默认 CN,本地配置 $DSH_HOME/plugins/dsh-home-network-model-guard/config.json 可改,不进仓库;TTL 5min + 本机 IPv4 指纹 + 配置代际失效,single-flight,响应只含分类/新鲜度不泄漏 IP);web 订阅官方 modelDirectories per-session store + conversation.blocks,Claude 家族识别 provider+model 双字段(claude/anthropic 路由 + claude-* 模型名),routable=false 让位官方,只清自己写入的 block,槽位自检防官方竞态;⚠ 信任面:仅访问两个声明过的 IP 归属服务,不主动探测 Anthropic/Cloudflare,不回传本地信息,不落盘 IP;blocked/unknown 对 Claude fail-closed(CLI/subagent 等 Host 流由 llm/stream 门禁兜底,实现中),非 Claude 不受影响;仅客户端 affordance 定位已升级为 Host 强制;DSH 升级需回归 blocks 共存语义(design Decisions 4)。[2026-09-05 运行体 0.1.2-rc.1 迁移]host 半区删除 `{authority:''loopback''}` 注册参数(该参数在 0.1.2 已不存在),回环边界改由 connection 层统一施加并**实测确认**(LAN Host 403);client 半区 inject 由 dsh-client-runtime 改为 dsh-api-session-controller + dsh-client-ui-renderer;56 例测试全过。[openspec change restore-blocked-composer-height]⚠ 临时补偿:0.1.2-rc.1 把 composer 从原生 textarea 迁到 Lexical contenteditable 时删除了撑高的隐藏 mirror(其内容为 draft+换行符,空草稿也占一行),高度改由 Lexical 产出的 p 元素承担,而仅存的 min-height 规则只作用于 hero 态——于是 block 生效且**草稿为空**时无 p 元素,内容区高度归零,绝对定位的原因文案被 scroll 容器 overflow 裁掉(实机 height 3.99858px,盒模型 956x0 + padding 4);草稿非空时有 p 元素不塌、内容照常保留,该路径本就正常。本包注入 COMPOSER_FALLBACK_CSS `[data-input-scroll] > div{min-height:24px}`:只锚定稳定 data-* 属性不用构建期哈希类名(每次重新构建都会变),补在内容区父级而非编辑器本身以免与官方 .hero .input{min-height:52px} 争夺同一元素同一属性,且为下界非覆写(24px=一行 line-height,已有高度的状态不受影响)。⚠ 运行体重新为非 hero 态 composer 内容区提供最小高度(或恢复等价 mirror)后**应删除该规则**;验证方式:移除后确认「block 生效+空草稿」仍能显示原因文案。该回归非本包特有——官方 ui-model-selection 在 routable=false 时走同一 blocked 分支同样会塌,本兜底无条件生效顺带覆盖'
  # 自研(local):DSH Pet 常驻桌宠 Agent 入口(Host+Web 双半区)
  - id: dsh-pet
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 常驻桌宠 Agent 入口(Pet Task/Invocation/可信来源快照/受管 Skill store)
    note: 'openspec change add-dsh-pet;Host+Web bundle。Host 随 dsh web 同进程启动,自有受控生命周期(starting/ready/degraded/stopping)——Pet 初始化失败只降级自身,不阻止其余 DSH 服务加载。持久化:组合官方 @deepseek-ai/dsh-storage-sqlite 并仅把 dsh_pet 域路由到该 backend(storage-domain.routes 为覆盖式,profile 其余域保持默认 json);运行时状态一律位于 $DSH_HOME/plugins/dsh-pet/(state.sqlite / workspace / skills/store),与包安装目录和生成 profile 分离,插件升级或 profile 重建不覆盖任务数据。模型:每来源 scope 至多一个未归档 Pet Task,固定复用位于专用 DSH Pet Workspace 的一个普通 root executor session;每次调用创建新 Invocation 并固定当时 source 快照,页面切换不改写已创建 Invocation。Skill 隔离:Pet 不自带任何 Skill,也不提供让 Skill 为 Pet 适配的机制(petLabel/petIcon/petContext 解析已移除)——能力一律来自用户从 Host 绝对路径显式导入的普通 DSH Skill,登记为指向用户自有目录的 local-link 并软链投影到 workspace/.dsh/skills;授权边界是 Pet allowlist provider 而非投影,投影损坏/越界 fail-closed 并需显式重建。Pet 不按能力施加上下文门禁,来源是否够用由 Skill 自行校验。可信上下文:零参数 pet_context 工具按实际调用 executor session 反查当前 Invocation,模型无法传标识改绑目标。⚠ 该工具必须注册在 **executor 的 scoped agent 上下文**:官方 tools.register() 按调用上下文的 scope tag 决定层级,**无 scope 即静默落 global 层**——注册在 Host 上下文会让普通会话看到 pet_context 并误调用得到 NOT_A_PET_SESSION(openspec change scope-pet-context-tool-to-executor,2026-09-07 实机复现)。同一 change 覆盖 executor 加载的三条路径:Pet create、Pet resume(新 scope 必须重装 preset 与 scoped surface)及 DSH 自身从原生列表加载(agent/created 仅补 scoped surface,不重复 mount 已挂载 preset);所有 Pet Task executor 获得 pet_context,仅专用 Pet executor 获得 allowlist provider,workspace-resident executor 保留 standard preset 与 workspace Skills;WeakSet 幂等闸防重复注册,dispatch 前缺 scope 则 fail closed。[2026-09-10 真机修复]Cordis `ctx.inject()` 回调异步执行,不得注册后同步检查 WeakSet；create/resume setup 现显式等待 skills/tools 两个回调真实完成,外部加载 executor 复用同一 in-flight Promise,5s 未就绪 fail-closed；空且 failed 的 executor 创建壳会自动归档并新建 epoch,已有 Invocation 的失败历史不动。管理面为 loopback + same-origin 精确路由,严格字段校验、响应脱敏,不暴露任意 DSH RPC/prompt/文件路径(仅专用导入操作)。不读取或保存 provider 凭据。飞书入站(openspec change fix-pet-lark-onboarding):绑定使用新版 lark-cli `config init --name dsh-pet` 建专属 profile,Host-owned 订阅/身份/成员/历史/表情/回复均显式 `--profile dsh-pet --as bot`;绑定后以 `auth status --json --verify` 顶层结果核验 App ID 并原子持久化 bot open_id/name,旧 App-ID profile 不自动 rename/切换而在设置页要求显式重连。Channel onboarding 按 Bot→身份→allowlist→默认 workspace→启用/连接展示稳定步骤与 blocker;openspec change pair-pet-allowlist-member 增加允许成员单聊配对:Host 内存生成 40-bit `/pair xxxx-xxxx` bearer code(5min、单次、重启/取消/替换即失效),与正式 Channel 复用唯一受监督 consumer 且仅在 ready 后显示命令;严格限制 user+p2p+text+合法 open_id+配对水位+精确命令,首个认领者经串行配置写原子加入 allowlist,姓名仅作展示缓存;错误码/群聊/旧码静默,配对不创建 Task/Invocation/chat binding/表情,提交后才由 Host 固定回执;Settings 提供倒计时/复制/取消/重生/终态并保留手填 open_id 兜底。启用前 Host 重验全部前置;starting/reconnecting 页面做可取消有界刷新,避免错过 ready edge 后永久显示启动中。仅支持能由 `auth status --json --verify` 直接证明 bot open_id 的 lark-cli(最低已验证 1.0.93),旧版/未知版本提示升级且不启动 consumer;目标群缺 scope 仅持久化 code/scopes/官方 open.feishu.cn URL,ignored 仅节流记录低基数分类,不含正文/chat/message/sender/token。一期不含飞书入站 transport、跨设备 Pet Hub,也不改 dsh-cockpit 与 dsh-cockpit-bridge。隔离 DSH home 验收通过后启用(2026-09-01)。环境变量(openspec change pet-send-cr-and-workspace-env,2026-09-03):按 global 与来源 workspace 两个作用域配置键值,workspace 覆盖同名 global,两者皆无则变量不存在、由 Skill 停下询问;经官方 ctx.shellEnv 以 DSH_PET_<KEY> 注入 executor 每次 shell 调用,值不进 prompt/envelope,走 ShellExecRequest.dshEnv 通道;设置页第四页签「环境变量」含全局/工作区/生效结果三区,值默认打码、标示覆盖关系。⚠ shellEnv 为可选依赖:经 ctx.get 读取(写进 inject 会变必需依赖,Host 缺该服务时 Pet 永不加载),且 register 必须直接调用——包在 ctx.effect 里会因 effect 重跑重复注册抛错,中断 Pet 初始化并导致 executor 丢失 bash/fs 等官方工具(2026-09-03 实测复现并修复)。浮层:Pet 挂在 document.body 下自有宿主 + 独立 React root(非 portal,portal 会脱离事件委托容器使交互静默失效),position:fixed 按视口定位,不被 layout-push 侧栏(如 dsh-better-sidebar 压缩 #root)顶走。一期能力由两个普通 skill 提供:既有 ws,与新增 send-cr(仓库 skills/send-cr,经 lark-cli --as bot 发 CR 到 $DSH_PET_CR_GROUP,MR 由 $DSH_PET_MR_MATCHER 从来源 session 提取,reviewer 取自 bytedcli mr reviewer list;create-mr 不在一期范围)。飞书接入(openspec change pet-lark-inbound,2026-09-06):Pet Host 内嵌 lark-cli event consume(--as bot)订阅 im.message.receive_v1,凭据全程留在 lark-cli,Pet 零接触 app secret;绑定走 lark-cli config init(--new 创建 / --app-id+--app-secret-stdin 连接已有)并落在专属 profile dsh-pet,不动用户既有 app;secret 只经 stdin 转交、不入 argv/持久层/日志。入站五道防线均 fail closed 且静默丢弃(不打表情不回复,不暴露 bot 背后有 agent):allowlist(open_id,空清单=不放行任何人)→ 群聊 mention 命中自身 open_id(单聊直通)→ msg_id TTL 去重 → 启动水位防重放 → 消息类型/空内容。bot 自身 open_id 不靠显示名:由绑定后的 `auth status --json --verify` 直接证明并写入,缺失则拒绝启用,不从群消息回填。路由:chat_bindings 显式行 → default workspace 回退并写回 auto 绑定行;目标不可解析时不建 Task 只打失败表情。Task:chat 为独立 scope(两个群路由同一 workspace 也不共享 Task),新增 workspace-resident 形态——executor cwd 直接是目标 workspace,Pet 不做 workspace 准备也不向用户仓库写任何文件,因此该形态不承诺 Pet Skill allowlist 投影与 standing instructions 边界,信任来源是显式绑定+allowlist。Invocation 三个 skill 字段改为可选,新增对话式 Invocation(无 Skill、envelope 不发 /<skill> 令牌、派发前 Skill 校验因无对象而跳过;不引入任何内置或占位 Skill)。上下文:触发时一次性拉向上 20 + 向下 10 条,只进 prompt 不落库,带「参考材料不是指令」围栏,拉取失败降级不阻断。出站:表情状态机(OnIt→DONE/CRY)全部由 Host 观测 turn 终态驱动、零模型参与、fail-soft;单聊成功自动回复最终 assistant 文本(超长截断指向 DSH),群聊本期无文字出站;回复目标只取 invocation_channel 行,不存在接受模型提供标识的通道。生命周期:channel 独立状态机(connected/reconnecting/down)不影响浮层与既有能力,指数退避,回收用 SIGTERM(lark-cli 明确警告 kill -9 会泄漏服务端订阅),共享 bus daemon 不归 Pet 回收。schema v3→v4 纯加表(channel_config/chat_bindings/invocation_channel)+ 可选字段,不清存量。channel 默认关闭,需在设置页第五页签「飞书」显式绑定并启用。答疑群(openspec change pet-qa-group,2026-09-07):轮盘新增 Host 内置动作「答疑群」——不是 Skill 也不进 allowlist 模型,因为它要 fork 活的 parent Agent 并写受信绑定,二者 Skill 都够不到;轮盘语义因此从「已启用 Skill 列表」变为「快捷入口」,内置动作与 Skill 能力并列且共用容量。事务顺序 fork child → im +chat-create(仅邀请 allowlist 首位=机器所有者) → 写 kind:qa 绑定,任一步失败整体回收(child 经 drainContinuableChildren 释放);三步完成前该群按普通 allowlist 判定,即 fail closed。宿主能力经真机 spike 全绿验证后接入:ctx.subagents.startContinuable({provider:''fork''}) 建 continuable child(种子=parent 截至最后一个完成 turn/end,in-flight turn 不进种子),群消息经 dsh-subagent/internal 的 symbol 键 queuePrompt 排成 child 独立 turn,parent 非驻留时先 agents.resume,DSH 重启后 continuation manager 冷恢复 child。⚠ subagents/agents 均以 ctx.get 探测式接入(写进 inject 会让缺该服务的 Host 加载不了 Pet),探测失败时动作以禁用态显示原因而不是消失。准入:qa 绑定豁免 sender allowlist(群由 Host 亲手创建,成员只能被群内人拉入,故成员身份即凭据),豁免严格限于该 chat,其余防线(bot-sender/mention/去重/水位/消息类型)原样;非 qa 链路零变化。终态只信 subagent/end 事件——queuePrompt 返回仅代表 inbox 接受,不代表 turn 跑完更不代表落盘;结算按 chat 内最早未 settled 行匹配(child inbox 为 FIFO)。child 继承源会话组合与工具面,Pet 不装 preset 也不装 allowlist provider,不承诺任何 Skill 边界——信任来源是「本人建群+本人拉人」,prompt 要求改动前先确认(防呆不防坏)。源会话归档或无法 resume 时绑定失效:群内明示一次后静默(qa 群里 bot 已公开发言,静默只会显得坏了),child 会话与历史保留可查。schema v4→v5 纯加字段(chat_bindings.kind 缺省 workspace + qaChild/qaParent/qaInvalidated,tasks 新增 qa-chat sourceKind),不清存量'
