    note: '【2026-08-25 临时 fork patch,08-26 跟进 head】上游 PR #40「按模型默认推理档」(https://github.com/V1ki/dsh-plugin-subscriptions/pull/40)的 fork 分支 pinned tarball(prgrmrwy/dsh-plugin-subscriptions @ d927e3aa7f6580193b503aba0db2da4de1eec895,归档含 built lib;08-26 新提交 d927e3aa「feat(settings): collapse the per-model default-effort list」= 设置页每 provider 默认推理档列表默认收起为可展开区,头部计数(总数/已覆盖),>8 模型出名称过滤,带纯函数 deriveModelDefaultsView 单测);功能:设置→订阅每模型「默认推理档」下拉(枚举跟随 live 目录,Claude 不再只能 Default),选择器切换模型即预选,存 ~/.dsh/plugins/subscriptions/model-defaults.json(0600);验证:隔离 DSH_HOME 端到端(下拉→保存→/model 预选 High→真实 Claude 请求 22.1K in/4 out)+ tsc/build/单测 208 用例 0 失败;⚠ 上游合并发版后删除本临时条目并把 spec/version 切回 npm。原记录:B004 扩展(订阅制主对话,非委派);每次升级先读 change openspec/changes/2026-08-20-llm-subscriptions-upgrade(含 ADR-0001 选型);repo https://github.com/V1ki/dsh-plugin-subscriptions(MIT,158 stars,活跃,每日提交);功能:设置页 Subscriptions 页登录 ChatGPT(Codex)/ Claude / Grok(X Premium),登录后出现在会话模型选择器(/model 分组),live 模型目录(codex 走 chatgpt.com/backend-api/codex/models、claude 走 api.anthropic.com/v1/models 带 thinking/effort),附用量卡片 / Effort 选择器 / Speed 选择器 / image_generate / x_search;0.4.2 关键变化(2026-08-20 diff 0.3.1→0.4.2 源码核对):① claude 登录默认「导入本机 Claude Code 凭据」— macOS keychain(服务名 "Claude Code-credentials")→ 失败回退 ~/.claude/.credentials.json(尊重 CLAUDE_CONFIG_DIR),命中即秒登录不弹浏览器,无凭据时报"Run claude first";刷新后写回 CLI 凭据库(stale-blob 乐观并发校验,与 claude CLI 共享同账号不打架)② OAuth 底层改用 claude.com/cai/oauth/authorize + 固定回调 platform.claude.com/oauth/code/callback(旧 claude.ai/oauth/authorize 已废弃 → 修复 0.3.1 authorization failed)③ 新增 providerRetryPolicy(1s→60s 指数退避)与 execFileSync 探测 claude --version(⚠ 信任面变化:0.3.1 的"无 child_process"对 0.4.2 不成立,本条目由 2026-08-20 审查确认);路由 id(codex/claude/grok)未变 → subscriptions-sandbox-shim 与既有 codex 会话(auth.json)兼容;peer 仍 ^0.1.0-rc.5(兼容 rc.7 解析);风险:订阅自动化 ToS/封号(与网页版同级),config.providers 可只留 codex/claude;grok 不登录即不出现。0.5.0(2026-08-22 diff 0.4.2→0.5.0 升级):路由 id 未变、登录/凭据面未变;新增 Speed 档位(speed/setSpeed RPC,standard/fast)与 web-app rc.8 vendor 图库(ImageGallery);claude User-Agent 改惰性计算(行为不变)。0.5.2(2026-08-24 diff 0.5.0→0.5.2:commits 0f9c3307→958a236f→08b9b7cc 核对):**① claude prompt caching 完整落地(PR #25,closed #24;0.5.0 的 claude 路由从不发 cache_control → 每轮全价重放 tools/system/全部历史,订阅 5h 窗口烧速远高于 CLI——本机 8/20-8/24 实测 32.1M/日全价 input、cost-meter cacheRead=0,升级后应见 cacheRead>0)**:translate/anthropic.ts 新增 markMessageCache(前缀断点 + 会话尾部 ephemeral 断点),配套 fix(claude) 按名排序 tools 保证缓存前缀稳定、保留中段 system 消息;② Claude OAuth fallback(本机无 CLI 凭据时走交互登录,PR #10);③ 新增 GitHub Copilot provider(设备码登录,PR #13/#26,默认未登录不出现);④ HTTP(S) proxy 支持(PR #33);⑤ peer 依赖 bump 至 0.1.1-rc.2(对运行体 0.1.1-rc.2 满足);路由 id(codex/claude/grok)未变 → shim 兼容;风险与 0.5.0 同(ToS/封号),config.providers 建议只留 codex/claude'
