  - id: dsh-cockpit-bridge
    type: package
    source: remote
    spec: 'https://github.com/prgrmrwy/dsh-cockpit/releases/download/dsh-cockpit-bridge-v0.2.0/dsh-cockpit-bridge-0.2.0.tgz'
    name: dsh-cockpit-bridge
    version: 0.2.0
    enabled: true
    brief: 驾驶舱桥接(web 客户端上报会话点击,顶栏完成提醒自动清除)
    note: 'B015;repo https://github.com/prgrmrwy/dsh-cockpit(MIT,自研);web client cordis bundle,订阅官方 ctx.sessions.list.current(= 用户点击会话);0.2.0 协议 v2 重构:选择时立即捕获 ID 入有界去重 outbox(不再等 250ms debounce 定时器触发才重读 current,快速连续切换/打开后立即归档不再丢确认);outbox 项只在驾驶舱明确 2xx 后移除,网络异常/401/其它非 2xx 均保留并按有上限指数退避重试,由新选择/设备重新激活/成功 hello 触发;实际 Cockpit origin 与短期认证 capability 由父页面 postMessage 握手动态提供(不再固定 127.0.0.1:3090),适配任意 COCKPIT_PORT;驾驶舱按请求 Origin 匹配设备,按 sessionId 精确清除完成绿点且保留 re-arm(官方 select 语义的驾驶舱侧观察);驾驶舱同步升级后仍兼容旧协议(无 capability header)请求走既有 cookie 认证;只传 sessionId 与协议元数据,不碰内容/settings/凭据/provider token;驾驶舱不可达静默降级并重试,不影响原生 DSH 工作台;每台接驾驶舱的机器都装,需搭配驾驶舱同步升级到对应版本才能拿到可靠协议,否则仍按旧协议尽力而为工作(顶栏链条图标只表示插件装没装,不表示协议版本或连接新鲜度)。⚠ 必须 ≥0.1.1:v0.1.0 发布物缺 lib/index.js 而 package.json main 指向它、cordis.patch.yml 又把它插进 bundle 栈,导致装了该插件的设备 DSH 启动即崩(plugin tree failed to load / ERR_MODULE_NOT_FOUND),不是功能降级而是完全无法启动;0.1.1 补了 no-op host 入口(纯浏览器插件同样需要 loader entry 才能被 client-modules scanner 服务浏览器包)并让 tsdown 同时构建 host/client 两个半区'
