  # 组合补丁(非包):修复 DSH 0.1.5 的 Connection RPC channel 注册缺陷
  - id: connection-webserver
    type: patch
    enabled: true
    brief: 让 connection provider 自身等待 webServer,恢复全部 Connection RPC 通道注册
    note: '组合补丁(patches/connection-webserver.yml),修复 DSH 0.1.5 运行体缺陷(证据 change upgrade-dsh-0-1-5-runtime 的 checking/connection-rpc-devbox.md;上游讨论 deepseek-ai/deepseek-harness#5926):connection 行只声明 webRuntime,致所有 Connection RPC channel 路由静默挂载失败(通用 405,宿主无错误日志)。仅把 connection 行 inject 覆盖为 [webRuntime, webServer];整行覆盖必须原样保留 config.trustedHosts,否则丢 Host/Origin fence;不复制 RPC 协议与鉴权。仅适用 web profile(web carrier 成为硬依赖),引入无 web 的 profile 须拆分或移除。升级复核:每次 DSH 升级检查官方 connection 行 inject;官方自带 webServer 时删除本 fragment 与 patch 文件。移除:enabled:false → dsh build。'
