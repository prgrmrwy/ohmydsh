    note: '内部官方包(bnpm @byted/dsh-traex-bridge,maintainer chenxinhao.046@bytedance.com,仓库 https://code.byted.org/data/dsh-traex-bridge,0.1.0–0.1.8 于 2026-08-28 至 2026-09-01 发布,0.1.8 为 registry latest;升级后需重新验证 Web 设置页登录卡片/设备登录/SSO 与模型目录;直接实现 Trae 登录/模型目录/TraeChat 协议,运行时不依赖 traecli 与 ACP;bundle patch 插入 llm-traex-bridge 并把 agent-default-model 覆盖为 traex/DeepSeek-V4-Flash(仅新会话生效,2026-08-28 用户已确认接受);登录:设置→模型→TraeX Bridge 或 CLI dsh-traex-bridge login device/sso;凭据 ~/.dsh/traex-bridge/auth.json(0600),兼容读取 ~/.trae/cli/auth.json 等本机既有 Trae 登录态;能力:文本/reasoning/工具/token usage/排队,暂不支持图片(UNSUPPORTED_CONTENT);默认 Trae API https://copilot-cn.bytedance.net、ByteCloud 登录 https://cloud.bytedance.net;无 install/postinstall 脚本;peer 依赖 rc.2 区间对运行体 0.1.1-rc.2 满足;Node >=20(本机 22.16.0);安装通道 bnpm(用户级 ~/.npmrc registry=http://bnpm.byted.org;agent 环境注入的 NPM_CONFIG_REGISTRY 会覆盖,安装时需显式指定);⚠ 鉴权与推理流量走 ByteDance 内部服务,凭据仅在 DSH Host 本机保存;⚠ 2026-08-31 起本仓库默认 enabled:false + enabledEnv:DSH_TRAEX_BRIDGE(内部专属,公开仓库默认关闭),本机通过 .env.local 的 DSH_TRAEX_BRIDGE=1 打开,不改本条目 enabled'
  # 第三方(remote):设置 → 通用 一键重启 DSH 服务
  - id: setting-restart
    type: package
    source: remote
    spec: dsh-setting-restart@1.0.0
    version: 1.0.0
    enabled: true
    brief: 设置→通用「一键重启」(自重启:分离 helper 等旧进程退出后原样重拉)
    note: 'repo https://github.com/893413974-bit/dsh-setting-restart(MIT,maintainer david_birch <893413974@qq.com>,1.0.0 发布于 2026-08-18,当前为唯一版本);用途:设置 → 通用 底部一行「一键重启」按钮,免去回终端敲 dsh restart。审查(2026-09-04,npm 1.0.0 发布物逐文件通读,共 454 行 4 个 js):Host+Web bundle。**Host 面**:注册 settingRestart Cordis 服务,经 typert 严格 invocation 暴露单一无参端点 settingRestart/restart(结果为 strict 联合 codec,只有 {ok:true,{scheduled:true}} 与 {ok:false,{code,message}} 两支);调用后先 spawn 一个 detached+unref 的 relaunch.js helper,再延迟 exitDelayMs(默认 1200ms)执行 process.exit(0);helper 以 process.kill(pid,0) 每 250ms 轮询旧进程,确认消失(或到 waitForExitMs 默认 30s 上限)后用 execPath + 原 argv + 原 cwd + 原 env 重新 spawn,自身随即退出。**信任面**:全部 4 个文件无任何 fetch/http/net、无文件读写、无 shell 字符串拼接——spawn 一律传 argv 数组,不经 shell;无 install/postinstall 脚本;依赖仅 cordis/schemastery/zod/dsh-typert-protocol。可配置项 exitDelayMs / waitForExitMs / respawn 均带 schemastery 上下界;单机部署由 supervisor(systemd/pm2/包装脚本)托管时应设 respawn:false,否则会与 supervisor 重复拉起。**能力实质**:这是一个可由浏览器 UI 触发「终止并重拉 Host 进程」的端点,权限等价于本机 loopback RPC 可达者——本仓库其余插件无此形态,故单列于此;它不读凭据、不出网、不落盘,风险集中在"可被触发重启"本身而非数据外带。**与本机启动器的兼容性**:实测线上进程 argv 为自包含形式(node …/@deepseek-ai/dsh/lib/bin.js web --port 3080 --no-open),故 execPath+argv 原样重拉可复现同一命令;但 bin/dsh 的 start_server 会先做环境清洗(server_env_strip_args 剥离 npm_config_*)、record_startup 记录启动清单、并在就绪后 print_plugins——**自重启走的是进程自身 argv,不经 bin/dsh**,因此该路径不会刷新 dsh history 启动记录,也不重跑 autoUpdate 检测;需要完整启动语义时仍应用 dsh restart。⚠ 客户端半区 package.json 的 dsh.client.inject 声明了 @deepseek-ai/dsh-client-runtime(以及 dsh-api-remotes / dsh-client-ui-sidebar / dsh-client-ui-settings-general),而 client.js 运行时实际只 inject ["slots","locale","connection"];dsh-client-runtime 在 DSH 0.1.2 线已被上游移除,故本条目属于 change staged-dsh-and-plugin-upgrade 阶段四(运行体迁移)的回归对象,届时需复核其声明面与实际加载。'
