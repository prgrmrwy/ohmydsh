  # B004 扩展:订阅制主对话 provider — codex / claude / grok OAuth 登录后出现在输入框模型选择器(免 api-key)
  - id: llm-subscriptions
    type: package
    source: remote
    spec: dsh-plugin-subscriptions@0.8.0
    version: 0.8.0
      # [2026-09-07] codex 模型目录停在 GPT-5.6 线、看不到 GPT-6-Astra:
      #   0.6.0 硬编码上报 client_version=0.147.0,而 chatgpt.com 的
      #   /backend-api/codex/models 按客户端版本分流目录。同一账号实测
      #   0.147.0–0.152.0 均无 gpt-6-astra,0.153.4 起返回 visibility=list,
      #   故根因是 pin 过旧而非账号权限。上游 0.6.2 已把该常量提到 0.153.4。
    enabled: true
    brief: codex/claude/grok/copilot 订阅制 provider(Claude 复用本机登录态,输入框可切换)
    note: '0.8.0(2026-09-07 升级,npm 0.8.0 发布物核对):升级动机 = **恢复 codex 模型目录的完整性**。0.6.0 把 Codex 目录请求的 `client_version` 硬编码为 `0.147.0`,而 ChatGPT 后端按该参数分流可见模型:同一已登录账号实测 `0.147.0`/`0.148.0`/…/`0.152.0` 一律不返回 `gpt-6-astra`,`0.153.4` 起返回且 `visibility=list`,即 GPT-6-Astra 缺失是**部署侧 pin 过旧**,与订阅权限、OAuth 凭据、DSH 选择器过滤均无关(插件仅丢弃 `visibility` 为 `hide`/`none` 的条目,Astra 不在其中)。① Codex 客户端版本改为**动态解析**——`lib/providers/codex-client-version.js` 读取公开 npm 元数据 `registry.npmjs.org/@openai%2fcodex/latest` 取稳定版号,**新增一个出站域名 registry.npmjs.org**;该请求只带 `accept: application/json`、`redirect: error`,**不携带任何订阅凭据**,1.5s 超时、成功缓存 6h、失败 5min 后重试并保留上次成功值,首次失败回退内置常量 `0.153.4`,且忽略 prerelease 与"倒退"版本号;不想出网可在插件配置显式写 `codexClientVersion: ''0.153.4''` 固定并关闭自动查询(改后需重启)。② 新增 **GitHub Copilot** provider(`PROVIDER_IDS` 由 3 个变为 4 个:codex/claude/grok/copilot,走 GitHub OAuth device flow,目录来自 `api.githubcopilot.com/models`)——**未登录即不出现在选择器**,不登录不产生该 provider 的任何流量;随之新增声明面域名 `api.github.com`/`api.githubcopilot.com`/`github.com`。③ 其余新增能力:模型池(priority / quota_aware 故障转移)、`video_generate`(grok)、设置页可视模型/工具编辑器;工具受 per-session 开关约束(`image_generate` 在两个 provider 均禁用时消失,`x_search`/`video_generate` 跟随 grok 开关),会话策略在创建时固化。⚠ 信任面延续:仍 `execFileSync` 调 `/usr/bin/security`(macOS keychain 读写 Claude Code 凭据)与 `claude --version` 探测,与 0.4.2 起的记录一致,非本次新增。peer 仍为双运行体区间(`dsh-llm`/`-tools`/`-attachment`/`-home-paths` 均 `^0.1.1-rc.2 || ^0.1.2-alpha.1`,cordis `^4.0.1`),对现役 0.1.2-rc.1 满足;路由 id(`codex`/`claude`/`grok`)未变,故 `subscriptions-sandbox-shim`(按 codex/grok 匹配)无需改动;凭据仍在 `$DSH_HOME/plugins/subscriptions/auth.json`(0600),升级不改写,**无需重新登录**。回滚:`spec`/`version` 改回 `dsh-plugin-subscriptions@0.6.0` → `dsh build` → 重启(代价是 Astra 重新消失)。历史记录:0.6.0(2026-09-04 升级,发布物核对):临时 fork 条目已回收为常规 npm pin——上游 PR #40「按模型默认推理档」(https://github.com/V1ki/dsh-plugin-subscriptions/pull/40)已于 2026-08-29 合并并随 0.6.0 发布,本仓库 2026-08-25 起为携带该补丁而临时指向的 fork commit tarball(prgrmrwy/dsh-plugin-subscriptions @ d927e3aa)因此撤销,name 字段随 npm spec 一并省略;0.6.0 发布物已核对含该功能:lib/model-defaults.js(设置→订阅每模型「默认推理档」,枚举跟随 live 目录,Claude 不再只能 Default,选择器切换模型即预选;存 ~/.dsh/plugins/subscriptions/model-defaults.json,写入 mode 0o600 + chmod 0600)与设置页收起视图的纯函数 deriveModelDefaultsView;peer 为双运行体区间(@deepseek-ai/dsh-llm/-tools/-attachment/-home-paths 均 ^0.1.1-rc.2 || ^0.1.2-alpha.1,cordis ^4.0.1)——对现役 0.1.1-rc.2 满足,且同一份构建同时兼容 0.1.2-alpha 线,故本条目在阶段四运行体迁移时无需再动。原记录:B004 扩展(订阅制主对话,非委派);每次升级先读 change openspec/changes/2026-08-20-llm-subscriptions-upgrade(含 ADR-0001 选型);repo https://github.com/V1ki/dsh-plugin-subscriptions(MIT,158 stars,活跃,每日提交);功能:设置页 Subscriptions 页登录 ChatGPT(Codex)/ Claude / Grok(X Premium),登录后出现在会话模型选择器(/model 分组),live 模型目录(codex 走 chatgpt.com/backend-api/codex/models、claude 走 api.anthropic.com/v1/models 带 thinking/effort),附用量卡片 / Effort 选择器 / Speed 选择器 / image_generate / x_search;0.4.2 关键变化(2026-08-20 diff 0.3.1→0.4.2 源码核对):① claude 登录默认「导入本机 Claude Code 凭据」— macOS keychain(服务名 "Claude Code-credentials")→ 失败回退 ~/.claude/.credentials.json(尊重 CLAUDE_CONFIG_DIR),命中即秒登录不弹浏览器,无凭据时报"Run claude first";刷新后写回 CLI 凭据库(stale-blob 乐观并发校验,与 claude CLI 共享同账号不打架)② OAuth 底层改用 claude.com/cai/oauth/authorize + 固定回调 platform.claude.com/oauth/code/callback(旧 claude.ai/oauth/authorize 已废弃 → 修复 0.3.1 authorization failed)③ 新增 providerRetryPolicy(1s→60s 指数退避)与 execFileSync 探测 claude --version(⚠ 信任面变化:0.3.1 的"无 child_process"对 0.4.2 不成立,本条目由 2026-08-20 审查确认);路由 id(codex/claude/grok)未变 → subscriptions-sandbox-shim 与既有 codex 会话(auth.json)兼容;peer 仍 ^0.1.0-rc.5(兼容 rc.7 解析);风险:订阅自动化 ToS/封号(与网页版同级),config.providers 可只留 codex/claude;grok 不登录即不出现。0.5.0(2026-08-22 diff 0.4.2→0.5.0 升级):路由 id 未变、登录/凭据面未变;新增 Speed 档位(speed/setSpeed RPC,standard/fast)与 web-app rc.8 vendor 图库(ImageGallery);claude User-Agent 改惰性计算(行为不变)。0.5.2(2026-08-24 diff 0.5.0→0.5.2:commits 0f9c3307→958a236f→08b9b7cc 核对):**① claude prompt caching 完整落地(PR #25,closed #24;0.5.0 的 claude 路由从不发 cache_control → 每轮全价重放 tools/system/全部历史,订阅 5h 窗口烧速远高于 CLI——本机 8/20-8/24 实测 32.1M/日全价 input、cost-meter cacheRead=0,升级后应见 cacheRead>0)**:translate/anthropic.ts 新增 markMessageCache(前缀断点 + 会话尾部 ephemeral 断点),配套 fix(claude) 按名排序 tools 保证缓存前缀稳定、保留中段 system 消息;② Claude OAuth fallback(本机无 CLI 凭据时走交互登录,PR #10);③ 新增 GitHub Copilot provider(设备码登录,PR #13/#26,默认未登录不出现);④ HTTP(S) proxy 支持(PR #33);⑤ peer 依赖 bump 至 0.1.1-rc.2(对运行体 0.1.1-rc.2 满足);路由 id(codex/claude/grok)未变 → shim 兼容;风险与 0.5.0 同(ToS/封号),config.providers 建议只留 codex/claude'
