# mydsh 总配置 — DSH 定制的唯一开关面。
# 修改后运行 `dsh build`(或 `node scripts/sync.mjs`)物化到 ~/.dsh。
# 约定:禁用(enabled: false)≠删除;手改一律回写本仓库。

dshVersion: 0.1.0-rc.6     # 启动脚本 bin/dsh 运行时读取,单一版本来源

web:                       # Web 启动形态(非 customization;sync 直接渲染进 profile patch)
  lan: false               # 默认关闭。开启:绑定 0.0.0.0,启动后打印局域网地址,同网络设备可访问
                           # ⚠ 局域网可驱动完整 agent 能力(bash/文件读写),仅可信网络开启
                           # 开启方式:改 true 后 dsh build;或 .env.local 写 DSH_LAN=1(优先级更高)
                           # 临时仅本机:dsh --host 127.0.0.1

agentInstructions:          # DSH 原生工作环境级指令,单例物化为 $DSH_HOME/AGENTS.md
  enabled: true
  source: instructions/dsh-home.md

dependencies:               # 无 dsh.bundle 的支撑包(plain dependency,不进 bundle 层)
                            # 安装唯一入口:精确版本 pin,sync 管理;定制条目用 deps: 引用以声明归属
  # B004 配套:官方 codex provider 的 peer dependency,运行体(0.1.0-rc.6)未带
  - '@deepseek-ai/dsh-sdk-protocol@0.1.0-rc.6'

bundlesBrief:              # 出厂 bundle 的短备注(非 manifest 管理的包)
  "@deepseek-ai/dsh-base": 核心 bundle(agent / 会话 / 工具骨架)
  "@deepseek-ai/dsh-web-app": web 壳(浏览器 UI)

customizations:
  # 字段约定:brief = 启动清单里的短备注(优先于 note);note = 完整来源/审查记录;
  #          name = 非 npm spec(github/tarball)时的真实包名(必填;npm spec 可省略)
  # 第三方(remote):只存 pin + 覆盖 + 记录,不 vendor 源码
  - id: cost-meter
    type: package
    source: remote
    spec: dsh-cost-meter@1.5.6
    version: 1.5.6
    enabled: true
    brief: 会话费用统计
    note: 会话费用统计(web client 插件);仓库 https://github.com/Han-1413141/dsh-cost-meter;依赖拉到 rc.7 家族,重启后验证加载
  - id: modlens
    type: package
    source: remote
    spec: '@liustack/modlens@3.21.0'
    version: 3.21.0
    enabled: true
    brief: 支持图片识别(粘贴即视觉,走 Codex)
    note: B006 生态解:粘贴图片即视觉(web client + modlens_read_image 工具 + 模型选择器 vision 条目);repo https://github.com/liustack/modlens(3.1k stars,MIT,活跃);引擎策略:仅 codex(OpenAI 产品 CLI,二进制 codex),claude 显式禁用(reuse.claude=false);实测真实读图成功(33.8s,计 Codex 额度);需重启生效
  - id: archify-dsh
    type: package
    source: remote
    spec: '@tt-a1i/archify-dsh@0.1.0'
    version: 0.1.0
    enabled: true
    brief: 架构图 skill(架构/时序/数据流/生命周期)
    note: repo https://github.com/tt-a1i/archify(14.2k stars,MIT,活跃);skill-only bundle,对话内生成可交互架构图(自包含 HTML/PNG/SVG);后续可配合 B001 架构师角色;需重启生效
  # 自研(local)包位置见 packages/(本轮暂无);以下为第三方(remote):只存 pin + 记录,不 vendor 源码
  # B004 单机接入 — 官方 codex subagent(接线见下方 patch 条目)
  - id: subagent-codex
    type: package
    source: remote
    spec: '@deepseek-ai/dsh-subagent-codex@0.1.0-rc.6'
    version: 0.1.0-rc.6
    enabled: true
    deps:
      - '@deepseek-ai/dsh-sdk-protocol'   # 归属引用:安装以顶层 dependencies 为准
    brief: codex subagent 委派(本机 codex 登录态)
    note: B004 单机接入;官方 provider 无 dsh.bundle,装为 plain dependency(不进 bundle 层),接线两行见 patches/subagent-codex-wiring.yml;本机 codex-cli 0.144.3 握手实测通过(官方基线 0.147.0);claude 对应包待本机 claude 可用后另加
  # 自研 patch:B004 两行接线(provider + tool,直插 host 平面)
  - id: subagent-codex-wiring
    type: patch
    enabled: true
    brief: codex subagent 两行接线
  # 自研 skill:添加远端插件的标准流程
  - id: add-dsh-plugin
    type: skill
    enabled: true
  # 自研 skill:移除插件的标准流程
  - id: remove-dsh-plugin
    type: skill
    enabled: true
  # 自研 skill:沙箱/权限升级避坑(sandbox_permissions 正确用法 + core 缺陷绕过)
  - id: dsh-sandbox-notes
    type: skill
    enabled: true
  # 第三方(remote):B003 IDE 集成 — workspace 菜单一键在 VSCode 打开
  - id: open-in-vscode
    type: package
    source: remote
    spec: 'https://github.com/omdsh-dev/dsh-open-in-vscode/archive/refs/tags/v0.1.6.tar.gz'
    name: dsh-open-in-vscode
    version: 0.1.6
    enabled: true
    brief: 工作区菜单「在 VSCode 中打开」
    note: B003 落地;npm 0.2.0 已 unpublished,按官方 README 建议用 tag v0.1.6 的 tarball 直装(不跑 git prepare);MIT,50 stars,2026-08-16 活跃;host 行 dsh-open-in-vscode(typert 服务 openInVscode/open,用户点击时 spawn 编辑器 CLI)+ web client(workspace 行菜单,rc.6 走兼容适配器),无工具/无模型可见面;前置:本机装了 VS Code CLI(code),详见 https://github.com/omdsh-dev/dsh-open-in-vscode
  # B004 扩展:订阅制主对话 provider — codex / claude / grok OAuth 登录后出现在输入框模型选择器(免 api-key)
  - id: llm-subscriptions
    type: package
    source: remote
    spec: dsh-plugin-subscriptions@0.3.1
    version: 0.3.1
    enabled: true
    brief: codex/claude/grok 订阅制 provider(设置页 OAuth 登录,输入框可切换)
    note: B004 扩展(订阅制主对话,非委派);repo https://github.com/V1ki/dsh-plugin-subscriptions(MIT,127 stars,活跃,2026-08-19 最近提交);功能:设置页 Subscriptions 页 OAuth 登录 ChatGPT(Codex)/ Claude / Grok(X Premium),登录后出现在会话模型选择器(/model 分组 ChatGPT (Codex) / Claude (Subscription) / Grok (Subscription)),live 模型目录(codex 走 chatgpt.com/backend-api/codex/models,claude 内置 opus-4-5/sonnet-4-5/haiku-4-5),附用量卡片 / Effort 选择器 / image_generate / x_search 工具;审查(2026-08-19 源码已读):零运行时依赖,bundle 自带 patch,host 侧与 modlens 同机制 ctx.llm.registerAdapter(codex/claude/grok 三 adapter,未登录不出现在选择器,请求 MISSING_CREDENTIAL);OAuth 端点全部官方(openai.com/anthropic.com/x.ai),唯一本地端点 http://localhost 为 PKCE 回调;token 落 ~/.dsh/plugins/subscriptions/auth.json(0600,tmp+rename 原子写),自动刷新;无 child_process/eval/env 读取;peer deps 均 ^0.1.0-rc.5(满足 rc.6 运行体),client inject 三包(dsh-client-runtime/dsh-client-ui-settings/dsh-client-locale)rc.6 已具备;风险:订阅自动化使用存在 ToS/封号风险(open issue \#1,与网页版同级),可 config.providers 只留 codex/claude;grok 不登录即不出现,无需显式禁用
  # 自研(local):D001/issue #7 + Codex Responses 孤立 function_call 部署侧缓解
  - id: subscriptions-sandbox-shim
    type: package
    source: local
    version: 0.1.1
    enabled: true
    brief: 订阅 provider 工具面 sandbox 字段与 Responses 历史配对清洗(shim)
    note: 'D001/upstream https://github.com/V1ki/dsh-plugin-subscriptions/issues/7 部署侧缓解;适配器边界两层剥离(schema 出站 + arguments 入站),并清理中断 subagent settlement notice 注入父会话的孤立 tool-call(避免 Codex No tool output found HTTP 400);默认只作用 codex/grok,配置见 packages/subscriptions-sandbox-shim/README.md;⚠ sandbox 字段剥离仅限 danger-full-access + approval: never 部署,受限部署(read-only/workspace-write + ask)必须 enabled: false(合法升级通道会被误剥);上游修复后按 manifest 删除移除'
  # 第三方(remote):归档会话查看/恢复 — 官方只有 archiveSession 无 unarchive(上游 Discussion #2613 已知缺口)
  - id: ui-archive-manager
    type: package
    source: remote
    spec: '@tangzai/dsh-ui-archive-manager@0.1.1'
    version: 0.1.1
    enabled: true
    brief: 归档会话查看与恢复(设置页「归档管理」)
    note: 'repo https://github.com/Neumannzc/dsh-archive-manager(MIT);用途:设置 → 归档管理,按工作区列出已归档会话,一键取消归档回侧边栏继续原会话;审查(2026-08-19):host 端幂等补丁 WorkspaceRegistry.unarchiveSession(官方未来提供则让位),unarchive 走 registry 自身 enqueueOperation/requireState/setState 状态路径,经官方 archived-sessions-changed 帧广播;webServer 路由带信任防护(Host fence 防 DNS rebinding + Origin 校验 + 8KiB body cap);无删除/破坏性功能;仅 react peer;本地 clone 验证 typecheck + 17 单测 + build 全过(CI 红叉仅为 pnpm 忽略 esbuild 构建脚本的环境问题);⚠ TRUSTED_HOSTS 默认空 → 仅限 loopback(127.0.0.1/localhost),开启 web.lan 需源码加 trustedHosts;DSH 升级后需回归验证'
