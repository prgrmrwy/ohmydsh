    note: 'B013 落地;openspec change sidebar-session-provider-icon;Web client 订阅官方 modelDirectories per-session store,输入框模型切换成功即更新 logo;host provider projection 仅作未打开历史会话 fallback;品牌 SVG 下载落盘(DeepSeek/OpenAI/OpenCode/Anthropic/Grok/Kimi/GLM/MiniMax/Pi/OpenClaw/Hermes),不手绘;轻量 DOM 注入 + row-locator 单模块,不触碰官方 StateDot/时间/菜单/拖拽;未知选择首字母 fallback'
  # 自研(local):B018 会话标题旁 session id 短标识徽标(点击复制完整 id)
  - id: session-title-copy
    type: package
    source: local
    version: 0.1.2
    enabled: true
    brief: 标题右侧 6 位 session id 徽标(点击复制完整 id + toast;标题恢复官方)
    note: 'B018 落地 + 实机修订;openspec change session-title-id-badge;Web client 订阅官方 sessions list(current 为 id 真相源,cockpit-bridge 同 seam);标题旁插入自建徽标(去 session- 前缀取前 6 位,如 9af69b),hover tooltip 完整 id,点击复制完整 id + 瞬态提示;0.1.0 的标题点击复制已移除——标题恢复官方 disabled 原样;MutationObserver + sessions 订阅 rAF 防抖幂等 reconcile;DOM 结构知识单文件 title-locator;祖先面包屑打开行为不变;无 host 能力/无网络请求;定位失败/剪贴板拒绝安全降级'
  # 自研(local):B019 设置面板底部 DSH 主机系统时钟(24 小时制 + 时区)
  - id: system-clock
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 设置面板底部 DSH 主机系统时钟(24h + 时区 + hostname)
    note: 'B019 落地;openspec change settings-system-clock;Host+Web bundle:host 经通用 connection RPC 通道 /dsh-system-clock(authority loopback,接线同 subscriptions /subscriptions-auth)暴露只读 now 采样(主机 epoch / IANA 时区 / UTC 偏移 / hostname);web 注册官方 settings.section(id system-clock,order 300→设置导航最底部),一次采样 + skew 引擎本地每秒 tick,Intl timeZone + hour12:false 渲染,DST 正确;60s 周期 + visibilitychange 重同步;采样不可达显式降级,不静默回退浏览器时间;只读、零配置、无外部网络外呼'
  # 自研(local):家庭网络 × Claude 系列发送拦截(Web blocks affordance + Host 出口 IP 采样)
  - id: home-network-model-guard
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 家庭网络下禁用 Claude 系列模型发送(输入框禁用 + 原因文案)
    note: 'openspec change block-claude-on-home-network;Host+Web bundle:host 经 loopback RPC /dsh-home-network-model-guard 提供网络判定(公网出口 IP 白名单,HOME_NETWORKS=[115.197.18.69] 2026-09-03 家庭实测:连续 8 次一致 + ipinfo 交叉一致;TTL 5min 兜底 + 本机非 internal IPv4 指纹失效重查,single-flight 合并,失败 fail-open 不缓存可重试,同端点一次立即重试抗首连抖动,响应只含分类结论不泄漏 IP 原文);web 订阅官方 modelDirectories per-session store + conversation.blocks,Claude 家族识别 provider+model 双字段(claude/anthropic 路由 + claude-* 模型名),routable=false 让位官方不覆盖,只清自己写入的 block,block 槽位订阅自检防官方发布竞态清掉后防抖重断言;⚠ 本仓自研包首例外部网络外呼(单一固定端点 https://ifconfig.me/ip —— 2026-09-03 实测 api.ipify.org 办公网段与家庭网络均被拒故弃用,超时 5s,不回传本地信息,不落盘),仅客户端 affordance 非安全边界(官方 ComposerBlocks 定位,devtools/CLI 可绕过),如需强制另走 llm/stream waterfall;DSH 升级需回归 blocks 共存语义(design Decisions 4)'
  # 自研(local):DSH Pet 常驻桌宠 Agent 入口(Host+Web 双半区)
  - id: dsh-pet
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 常驻桌宠 Agent 入口(Pet Task/Invocation/可信来源快照/受管 Skill store)
    note: 'openspec change add-dsh-pet;Host+Web bundle。Host 随 dsh web 同进程启动,自有受控生命周期(starting/ready/degraded/stopping)——Pet 初始化失败只降级自身,不阻止其余 DSH 服务加载。持久化:组合官方 @deepseek-ai/dsh-storage-sqlite 并仅把 dsh_pet 域路由到该 backend(storage-domain.routes 为覆盖式,profile 其余域保持默认 json);运行时状态一律位于 $DSH_HOME/plugins/dsh-pet/(state.sqlite / workspace / skills/store),与包安装目录和生成 profile 分离,插件升级或 profile 重建不覆盖任务数据。模型:每来源 scope 至多一个未归档 Pet Task,固定复用位于专用 DSH Pet Workspace 的一个普通 root executor session;每次调用创建新 Invocation 并固定当时 source 快照,页面切换不改写已创建 Invocation。Skill 隔离:Pet 不自带任何 Skill,也不提供让 Skill 为 Pet 适配的机制(petLabel/petIcon/petContext 解析已移除)——能力一律来自用户从 Host 绝对路径显式导入的普通 DSH Skill,登记为指向用户自有目录的 local-link 并软链投影到 workspace/.dsh/skills;授权边界是 Pet allowlist provider 而非投影,投影损坏/越界 fail-closed 并需显式重建。Pet 不按能力施加上下文门禁,来源是否够用由 Skill 自行校验。可信上下文:零参数 pet_context 工具按实际调用 executor session 反查当前 Invocation,模型无法传标识改绑目标。管理面为 loopback + same-origin 精确路由,严格字段校验、响应脱敏,不暴露任意 DSH RPC/prompt/文件路径(仅专用导入操作)。不读取或保存 provider 凭据。一期不含飞书入站 transport、跨设备 Pet Hub,也不改 dsh-cockpit 与 dsh-cockpit-bridge。隔离 DSH home 验收通过后启用(2026-09-01)。环境变量(openspec change pet-send-cr-and-workspace-env,2026-09-03):按 global 与来源 workspace 两个作用域配置键值,workspace 覆盖同名 global,两者皆无则变量不存在、由 Skill 停下询问;经官方 ctx.shellEnv 以 DSH_PET_<KEY> 注入 executor 每次 shell 调用,值不进 prompt/envelope,走 ShellExecRequest.dshEnv 通道;设置页第四页签「环境变量」含全局/工作区/生效结果三区,值默认打码、标示覆盖关系。⚠ shellEnv 为可选依赖:经 ctx.get 读取(写进 inject 会变必需依赖,Host 缺该服务时 Pet 永不加载),且 register 必须直接调用——包在 ctx.effect 里会因 effect 重跑重复注册抛错,中断 Pet 初始化并导致 executor 丢失 bash/fs 等官方工具(2026-09-03 实测复现并修复)。浮层:Pet 挂在 document.body 下自有宿主 + 独立 React root(非 portal,portal 会脱离事件委托容器使交互静默失效),position:fixed 按视口定位,不被 layout-push 侧栏(如 dsh-better-sidebar 压缩 #root)顶走。一期能力由两个普通 skill 提供:既有 ws,与新增 send-cr(仓库 skills/send-cr,经 lark-cli --as bot 发 CR 到 $DSH_PET_CR_GROUP,MR 由 $DSH_PET_MR_MATCHER 从来源 session 提取,reviewer 取自 bytedcli mr reviewer list;create-mr 不在一期范围)'
  - id: dsh-pet-executor
    type: preset
    version: 0.1.0
    enabled: true
    brief: Pet 执行会话专用 preset(不加载 skill-filesystem)
    note: '与官方 standard 的唯一差别是移除 skill-filesystem。Pet 规范要求只有其允许清单中显式启用的 Skill 才可对执行会话发布/加载/注入,而 dsh-skill 的 collectFresh 始终把 global 层并入合并结果——scoped 注册是加法,provider 无法减去 preset 带进来的另一个 provider,因此排除它的唯一办法是不在 preset 中加载。保留 tool-skill:执行会话仍需目录与加载器,只是目录完全来自 Pet 允许清单。理由见 packages/dsh-pet/docs/adr/0001-executor-preset.md'
