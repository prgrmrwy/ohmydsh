# ohmydsh 总配置 — DSH 定制的唯一开关面。
# 修改后运行 `dsh build`(或 `node scripts/sync.mjs`)物化到 ~/.dsh。
# 约定:禁用(enabled: false)≠删除;手改一律回写本仓库。

dshVersion: 0.1.1-rc.2     # 启动脚本 bin/dsh 运行时读取,单一版本来源

autoUpdate:                # 启动/构建前自动检测并升级 DSH 版本(channel = registry dist-tag)
  enabled: false           # 关闭:完全跳过检测,钉在 dshVersion(需手动升级时改回 true;env DSH_SKIP_UPDATE=1 等效)
  channel: latest          # 追踪频道:latest / next;env DSH_UPDATE_CHANNEL 可临时覆盖(优先级最高)

web:                       # Web 启动形态(非 customization;sync 直接渲染进 profile patch)
  open: false              # 启动/检测时不自动打开浏览器或 PWA(2026-08-28 本机偏好)。
                           # 需要时显式 `dsh --open` 强制打开;`dsh --no-open` 仍可临时关闭。
                           # 缺省(字段不存在)视为 true = 保持旧行为。

agentInstructions:          # DSH 原生工作环境级指令,单例物化为 $DSH_HOME/AGENTS.md
  enabled: true
  source: instructions/dsh-home.md

bundlesBrief:              # 出厂 bundle 的短备注(非 manifest 管理的包)
  "@deepseek-ai/dsh-base": 核心 bundle(agent / 会话 / 工具骨架)
  "@deepseek-ai/dsh-web-app": web 壳(浏览器 UI)

customizations:
  # 字段约定:brief = 启动清单里的短备注(优先于 note);note = 完整来源/审查记录;
  #          name = 非 npm spec(github/tarball)时的真实包名(必填;npm spec 可省略)
  #          enabledEnv = 可选,声明后同名 DSH_ 环境变量(真值 1/true/yes/on、
  #            假值 0/false/no/off)覆盖本条目有效启用状态,未设置/无法识别时
  #            回退到 enabled;用于默认关闭、仅在有权限的机器上用 env 打开的
  #            定制(如内部专属包),与顶层 web / DSH_ 环境变量同一套真值/假值语义
  # 第三方(remote):只存 pin + 覆盖 + 记录,不 vendor 源码
  - id: cost-meter
    type: package
    source: remote
    spec: dsh-cost-meter@1.7.10
    version: 1.7.10
      # [2026-09-04] staged-dsh-and-plugin-upgrade 阶段一:cost-meter 1.5.42 -> 1.7.10
    enabled: true
    brief: 会话费用统计
    note: '会话费用统计(web client 插件);仓库 https://github.com/Han-1413141/dsh-cost-meter;1.7.10(2026-09-04 审查,npm 1.7.10 发布物核对):① 密钥治理变更——所有密钥(OpenCode Go Key、各 Coding Plan Key、火山 AK/SK、自定义余额 {{VAR}} 占位符)不再明文落盘,一律迁入 DSH 凭据库(新增运行时依赖 @deepseek-ai/dsh-credentials 0.1.0-rc.8,与 dsh-home-paths 同为精确锁版),设置页输入框改 write-only(保存后不可回显),账本 ledger.json 与下发浏览器的配置永不含明文;旧版写在请求头里的明文密钥在启动时自动导入凭据库并替换为 {{CUSTOM_BALANCE_KEY_…}} 占位符;携带凭据出站另受 customBalance.allowedHosts 白名单约束(未配置时放行并告警一次,不 fail closed)。② 网络声明面扩大——host 侧出现的域名由 1.5.42 的 18 个增至 19 个(净增 cli-chat-proxy.grok.com、chatgpt.com、cloudcode-pa.googleapis.com 及其 daily/sandbox 变体,来自新增的 CLIProxyAPI 网关额度适配器与 xAI/Codex 额度查询;另有 open.volcengineapi.com 为火山方舟 AK/SK 管控面 HMAC 签名端点);其中一部分仅为文档/价目表链接常量(api-docs.deepseek.com、opencode.ai/docs、ax.ac.sugon.com 等)而非请求目标。**隐私边界:余额/额度类端点仅在用户显式启用对应 Provider 时才出站,未启用不产生任何网络流量**;API Key 只发往各自官方域名(baseURL 指向非官方域名时余额查询直接拒绝,模型请求不受影响)。③ 版本选择——1.7.0/1.7.8/1.7.9 曾致宿主启动即崩,故直接取该功能线首个稳定版 1.7.10;升级后必须先做宿主冒烟(排查 plugin tree failed to load / Cannot access / strict codec)再推进后续阶段。仍为纯 web client 插件(dsh.client.platform=web + 自带 cordis.patch.yml),不导入 cordis/dsh 的 Service/Context 运行时类,故不受阶段四运行体迁移直接影响;engines.node >=20。历史记录:1.5.35(2026-08-21 审查):v1.5.34 为 dsh 0.1.1-rc.x 适配(修复 rc.2 下费用展示丢失),v1.5.32 内置 DeepSeek-V4-Flash-Vision-Exp 计价,v1.5.35 修正未命中模型列表口径;升级后需重启验证加载与展示'
  - id: archify-dsh
    type: package
    source: remote
    spec: '@tt-a1i/archify-dsh@0.1.0'
    version: 0.1.0
    enabled: true
    brief: 架构图 skill(架构/时序/数据流/生命周期)
    note: repo https://github.com/tt-a1i/archify(14.2k stars,MIT,活跃);skill-only bundle,对话内生成可交互架构图(自包含 HTML/PNG/SVG);后续可配合 B001 架构师角色;需重启生效
  # 自研(local):首页空白会话首发启动到隔离 Git worktree。
  - id: worktree-session
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: Worktree Session 首发隔离(task branch/lean deps/独立 build home)
    note: '自研 Host+Web bundle；从 base 在首次普通发送时创建唯一 ws/* branch 与 .worktrees/* checkout，不切换主 checkout；npm lean/mutable、.env.local ignored-only 同步、隔离开发 DSH_HOME、安全 status/promote/clean；交互与 Git 探测概念参考 https://github.com/LaoYueHanNi/dsh-git-worktree (MIT，详见 packages/worktree-session/NOTICE)'
  # 自研(local):B013 sidebar 会话行前动态 provider logo
  - id: sidebar-session-provider-icon
    type: package
    source: local
    version: 0.1.2
    enabled: true
    brief: 侧边栏会话行当前选中模型品牌 logo(选择器即时切换)
    note: 'B013 落地;openspec change sidebar-session-provider-icon;Web client 订阅官方 modelDirectories per-session store,输入框模型切换成功即更新 logo;host provider projection 仅作未打开历史会话 fallback;品牌 SVG 下载落盘(DeepSeek/OpenAI/OpenCode/Anthropic/Grok/Kimi/GLM/MiniMax/Pi/OpenClaw/Hermes),不手绘;轻量 DOM 注入 + row-locator 单模块,不触碰官方 StateDot/时间/菜单/拖拽;未知选择首字母 fallback'
  # 自研(local):B018 会话标题旁 session id 短标识徽标(点击复制完整 id)
  - id: session-title-copy
    type: package
    source: local
    version: 0.1.2
    enabled: true
    brief: 标题右侧 6 位 session id 徽标(点击复制完整 id + toast;标题恢复官方)
    note: 'B018 落地 + 实机修订;openspec change session-title-id-badge;Web client 订阅官方 sessions list(current 为 id 真相源,cockpit-bridge 同 seam);标题旁插入自建徽标(去 session- 前缀取前 6 位,如 9af69b),hover tooltip 完整 id,点击复制完整 id + 瞬态提示;0.1.0 的标题点击复制已移除——标题恢复官方 disabled 原样;MutationObserver + sessions 订阅 rAF 防抖幂等 reconcile;DOM 结构知识单文件 title-locator;祖先面包屑打开行为不变;无 host 能力/无网络请求;定位失败/剪贴板拒绝安全降级'
  # 自研(local):B019 设置面板底部 DSH 主机系统时钟(24 小时制 + 时区)
  - id: system-clock
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 设置面板底部 DSH 主机系统时钟(24h + 时区 + hostname)
    note: 'B019 落地;openspec change settings-system-clock;Host+Web bundle:host 经通用 connection RPC 通道 /dsh-system-clock(authority loopback,接线同 subscriptions /subscriptions-auth)暴露只读 now 采样(主机 epoch / IANA 时区 / UTC 偏移 / hostname);web 注册官方 settings.section(id system-clock,order 300→设置导航最底部),一次采样 + skew 引擎本地每秒 tick,Intl timeZone + hour12:false 渲染,DST 正确;60s 周期 + visibilitychange 重同步;采样不可达显式降级,不静默回退浏览器时间;只读、零配置、无外部网络外呼'
  # 自研(local):受限地区 × Claude 发送拦截(Web blocks + Host 出口国家码判定,双备份 Geo,未知 fail-closed)
  - id: home-network-model-guard
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 出口位于受限地区时禁用 Claude 系列模型发送(输入框禁用 + 原因文案)
    note: 'openspec change block-claude-on-home-network 归档后更新为 trusted-egress-claude-guard;Host+Web bundle:host 经 loopback RPC /dsh-home-network-model-guard 提供出口判定(两个互为备份的 HTTPS Geo 服务读国家码:主失败切备,双失败 unknown 且指数退避持续重试 2s→60s;blockedCountries 默认 CN,本地配置 $DSH_HOME/plugins/dsh-home-network-model-guard/config.json 可改,不进仓库;TTL 5min + 本机 IPv4 指纹 + 配置代际失效,single-flight,响应只含分类/新鲜度不泄漏 IP);web 订阅官方 modelDirectories per-session store + conversation.blocks,Claude 家族识别 provider+model 双字段(claude/anthropic 路由 + claude-* 模型名),routable=false 让位官方,只清自己写入的 block,槽位自检防官方竞态;⚠ 信任面:仅访问两个声明过的 IP 归属服务,不主动探测 Anthropic/Cloudflare,不回传本地信息,不落盘 IP;blocked/unknown 对 Claude fail-closed(CLI/subagent 等 Host 流由 llm/stream 门禁兜底,实现中),非 Claude 不受影响;仅客户端 affordance 定位已升级为 Host 强制;DSH 升级需回归 blocks 共存语义(design Decisions 4)'
  # 自研(local):DSH Pet 常驻桌宠 Agent 入口(Host+Web 双半区)
  - id: dsh-pet
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 常驻桌宠 Agent 入口(Pet Task/Invocation/可信来源快照/受管 Skill store)
    note: 'openspec change add-dsh-pet;Host+Web bundle。Host 随 dsh web 同进程启动,自有受控生命周期(starting/ready/degraded/stopping)——Pet 初始化失败只降级自身,不阻止其余 DSH 服务加载。持久化:组合官方 @deepseek-ai/dsh-storage-sqlite 并仅把 dsh_pet 域路由到该 backend(storage-domain.routes 为覆盖式,profile 其余域保持默认 json);运行时状态一律位于 $DSH_HOME/plugins/dsh-pet/(state.sqlite / workspace / skills/store),与包安装目录和生成 profile 分离,插件升级或 profile 重建不覆盖任务数据。模型:每来源 scope 至多一个未归档 Pet Task,固定复用位于专用 DSH Pet Workspace 的一个普通 root executor session;每次调用创建新 Invocation 并固定当时 source 快照,页面切换不改写已创建 Invocation。Skill 隔离:Pet 不自带任何 Skill,也不提供让 Skill 为 Pet 适配的机制(petLabel/petIcon/petContext 解析已移除)——能力一律来自用户从 Host 绝对路径显式导入的普通 DSH Skill,登记为指向用户自有目录的 local-link 并软链投影到 workspace/.dsh/skills;授权边界是 Pet allowlist provider 而非投影,投影损坏/越界 fail-closed 并需显式重建。Pet 不按能力施加上下文门禁,来源是否够用由 Skill 自行校验。可信上下文:零参数 pet_context 工具按实际调用 executor session 反查当前 Invocation,模型无法传标识改绑目标。管理面为 loopback + same-origin 精确路由,严格字段校验、响应脱敏,不暴露任意 DSH RPC/prompt/文件路径(仅专用导入操作)。不读取或保存 provider 凭据。一期不含飞书入站 transport、跨设备 Pet Hub,也不改 dsh-cockpit 与 dsh-cockpit-bridge。隔离 DSH home 验收通过后启用(2026-09-01)。环境变量(openspec change pet-send-cr-and-workspace-env,2026-09-03):按 global 与来源 workspace 两个作用域配置键值,workspace 覆盖同名 global,两者皆无则变量不存在、由 Skill 停下询问;经官方 ctx.shellEnv 以 DSH_PET_<KEY> 注入 executor 每次 shell 调用,值不进 prompt/envelope,走 ShellExecRequest.dshEnv 通道;设置页第四页签「环境变量」含全局/工作区/生效结果三区,值默认打码、标示覆盖关系。⚠ shellEnv 为可选依赖:经 ctx.get 读取(写进 inject 会变必需依赖,Host 缺该服务时 Pet 永不加载),且 register 必须直接调用——包在 ctx.effect 里会因 effect 重跑重复注册抛错,中断 Pet 初始化并导致 executor 丢失 bash/fs 等官方工具(2026-09-03 实测复现并修复)。浮层:Pet 挂在 document.body 下自有宿主 + 独立 React root(非 portal,portal 会脱离事件委托容器使交互静默失效),position:fixed 按视口定位,不被 layout-push 侧栏(如 dsh-better-sidebar 压缩 #root)顶走。一期能力由两个普通 skill 提供:既有 ws,与新增 send-cr(仓库 skills/send-cr,经 lark-cli --as bot 发 CR 到 $DSH_PET_CR_GROUP,MR 由 $DSH_PET_MR_MATCHER 从来源 session 提取,reviewer 取自 bytedcli mr reviewer list;create-mr 不在一期范围)'
  - id: dsh-pet-executor
    type: preset
    version: 0.1.0
    enabled: true
    brief: Pet 执行会话专用 preset(不加载 skill-filesystem)
    note: '与官方 standard 的唯一差别是移除 skill-filesystem。Pet 规范要求只有其允许清单中显式启用的 Skill 才可对执行会话发布/加载/注入,而 dsh-skill 的 collectFresh 始终把 global 层并入合并结果——scoped 注册是加法,provider 无法减去 preset 带进来的另一个 provider,因此排除它的唯一办法是不在 preset 中加载。保留 tool-skill:执行会话仍需目录与加载器,只是目录完全来自 Pet 允许清单。理由见 packages/dsh-pet/docs/adr/0001-executor-preset.md'
