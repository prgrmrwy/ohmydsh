    brief: 划选即问侧边栏问答(压缩上下文,省 token)
    note: 'B007 终选(替代 dsh-air:fork 全量继承费 token,codex 订阅无缓存保障);repo https://github.com/ChenRuoT/dsh-sidebar-qa(MIT,2026-08-24 README+发布物审查);划选文本→「提问」→侧边栏内嵌问答,独立会话(❓<主题>)不中断主对话;三种上下文策略=全量继承(fork+前缀缓存)/压缩(快速模型压旧历史+近期原文,默认)/机械裁切(定长窗口),默认 compressed 解决侧问费 token 痛点;嵌套追问+追问记录树(归档/删除置灰);依赖 dsh-better-sidebar ^0.14.0(同批入 manifest);peer rc.8 系对运行体 0.1.1-rc.2 满足'
  # 自研(remote):B015 驾驶舱桥接 — DSH web 客户端上报会话点击给本机 dsh-cockpit
  - id: dsh-cockpit-bridge
    type: package
    source: remote
    spec: 'https://github.com/prgrmrwy/dsh-cockpit/releases/download/dsh-cockpit-bridge-v0.1.2/dsh-cockpit-bridge-0.1.2.tgz'
    name: dsh-cockpit-bridge
    version: 0.1.2
    enabled: true
    brief: 驾驶舱桥接(web 客户端上报会话点击,顶栏完成提醒自动清除)
    note: 'B015;repo https://github.com/prgrmrwy/dsh-cockpit(MIT,自研);web client cordis bundle,订阅官方 ctx.sessions.list.current(= 用户点击会话),防抖上报 POST /api/bridge/session-opened 给本机驾驶舱(127.0.0.1:3090,401 先 bootstrap);驾驶舱按请求 Origin 匹配设备,按 sessionId 精确清除完成绿点且保留 re-arm(官方 select 语义的驾驶舱侧观察);启动 hello 让顶栏显示桥接连接态;0.1.2 增加 cockpit 切回已加载设备 iframe 时重新上报当前 session，清除当前 active 已完成会话绿点;只传 sessionId,不碰内容/settings/凭据;驾驶舱不可达静默降级;每台接驾驶舱的机器都装。⚠ 必须 ≥0.1.1:v0.1.0 发布物缺 lib/index.js 而 package.json main 指向它、cordis.patch.yml 又把它插进 bundle 栈,导致装了该插件的设备 DSH 启动即崩(plugin tree failed to load / ERR_MODULE_NOT_FOUND),不是功能降级而是完全无法启动;0.1.1 补了 no-op host 入口(纯浏览器插件同样需要 loader entry 才能被 client-modules scanner 服务浏览器包)并让 tsdown 同时构建 host/client 两个半区'
  # 第三方(remote):本机 TraeX 官方 bridge — 模型选择器选 TraeX Bridge / traex
  # 2026-08-28 决策:官方 bridge 替代社区 ACP 方案(不 spawn traecli;traex-acp-provider 已移除)
  # 2026-08-31 决策:内部包(bnpm/内网鉴权),开源/无 ByteDance 内网环境默认禁用;
  #   本机(有 bnpm/内网权限)需要时在 .env.local(不进 git)设 DSH_TRAEX_BRIDGE=1
  #   即可打开,不改这份文件;设为 0 或不设则禁用,`dsh build` 后立即生效
  - id: dsh-traex-bridge
    type: package
    source: remote
    spec: '@byted/dsh-traex-bridge@0.1.1'
    version: 0.1.1
    enabled: false
    enabledEnv: DSH_TRAEX_BRIDGE
    brief: TraeX 官方 bridge provider(设置→模型→TraeX Bridge;默认关闭,见 enabledEnv)
    note: '内部官方包(bnpm @byted/dsh-traex-bridge,maintainer chenxinhao.046@bytedance.com,仓库 https://code.byted.org/data/dsh-traex-bridge,0.1.0/0.1.1 皆 2026-08-28 发布,0.1.1 新增 Web 设置页登录卡片+设备登录/SSO,9/9 测试通过);直接实现 Trae 登录/模型目录/TraeChat 协议,运行时不依赖 traecli 与 ACP;bundle patch 插入 llm-traex-bridge 并把 agent-default-model 覆盖为 traex/DeepSeek-V4-Flash(仅新会话生效,2026-08-28 用户已确认接受);登录:设置→模型→TraeX Bridge 或 CLI dsh-traex-bridge login device/sso;凭据 ~/.dsh/traex-bridge/auth.json(0600),兼容读取 ~/.trae/cli/auth.json 等本机既有 Trae 登录态;能力:文本/reasoning/工具/token usage/排队,暂不支持图片(UNSUPPORTED_CONTENT);默认 Trae API https://copilot-cn.bytedance.net、ByteCloud 登录 https://cloud.bytedance.net;无 install/postinstall 脚本;peer 依赖 rc.2 区间对运行体 0.1.1-rc.2 满足;Node >=20(本机 22.16.0);安装通道 bnpm(用户级 ~/.npmrc registry=http://bnpm.byted.org;agent 环境注入的 NPM_CONFIG_REGISTRY 会覆盖,安装时需显式指定);⚠ 鉴权与推理流量走 ByteDance 内部服务,凭据仅在 DSH Host 本机保存;⚠ 2026-08-31 起本仓库默认 enabled:false + enabledEnv:DSH_TRAEX_BRIDGE(内部专属,公开仓库默认关闭),本机通过 .env.local 的 DSH_TRAEX_BRIDGE=1 打开,不改本条目 enabled'
