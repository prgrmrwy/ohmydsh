# ohmydsh 总配置 — DSH 定制的唯一开关面。
# 修改后运行 `dsh build`(或 `node scripts/sync.mjs`)物化到 ~/.dsh。
# 约定:禁用(enabled: false)≠删除;手改一律回写本仓库。

dshVersion: 0.2.0-rc.2     # 启动脚本 bin/dsh 运行时读取,单一版本来源

autoUpdate:                # 启动/构建前自动检测并升级 DSH 版本(channel = registry dist-tag)
  enabled: false           # 关闭:完全跳过检测,钉在 dshVersion(需手动升级时改回 true;env DSH_SKIP_UPDATE=1 等效)
  channel: latest          # 追踪频道:latest / next;env DSH_UPDATE_CHANNEL 可临时覆盖(优先级最高)

web:                       # Web 启动形态(非 customization;sync 直接渲染进 profile patch)
  open: false              # 启动/检测时不自动打开浏览器或 PWA(2026-08-28 本机偏好)。
                           # 需要时显式 `dsh --open` 强制打开;`dsh --no-open` 仍可临时关闭。
                           # 缺省(字段不存在)视为 true = 保持旧行为。

agentInstructions:          # DSH 原生工作环境级指令,单例物化为 $DSH_HOME/AGENTS.md
  enabled: true
  source: instructions/dsh-home.md

# 精确 pin 的外部决策/工作流资源。sync 先验证来源身份，再物化；禁用只撤销受管产物。
thirdPartyResources:
  - id: spec-superflow
    type: npm-workflow
    enabled: true
    spec: spec-superflow@2.0.1
    version: 2.0.1
    integrity: sha512-G5P8ossz5R7lDuUWAO1v5aVG93qVjk3D85+tF2gkPGVhnVgdfEZ+pqllsAo+IEMsKa7/KE52ohbAhb9m+r0XtQ==
    provider:
      spec: '@deepseek-ai/dsh-skill-filesystem@0.2.0-rc.2'
      version: 0.2.0-rc.2
      integrity: sha512-V/88b4uEFwhCAewQhI/VE7/IvgBkDQb//3/zQjK7xieZ+D9wVpOc5AY8GCcQThZu5aGBnI1gX5ITHPlUHjKUtQ==
    providerName: spec-superflow-upstream
    skills: [bug-investigator, build-executor, code-reviewer, contract-builder, need-explorer, release-archivist, spec-merger, spec-writer, workflow-start]
  - id: jev
    type: npm-mcp-server
    enabled: true
    spec: '@jkudish/jev-mcp@0.6.0'
    version: 0.6.0
    integrity: sha512-AAQeZESEMatz5m5X/bojvcL3bpwTPxebFOXBSj66KKNOKznumhne2VsLQ9btxPWBS8obhbVvCInwooy7Phudtw==
    bridge:
      spec: '@deepseek-ai/dsh-mcp-client@0.2.0-rc.2'
      version: 0.2.0-rc.2
      integrity: sha512-UqP2sY1r6qAhBPFeuclqrXiMBBxPaCNrXlXRqKxAON7uI1wmZZ0B3/1GmBviQ3/WjjTQlOOkj0su2v4e5DMkug==
    serverName: jev
    credentialEnv: TYPESAFE_API_KEY
    toolCallTimeoutMs: 30000
    reconnect:
      enabled: true
      initialDelayMs: 500
      maxDelayMs: 10000
      maxAttempts: 5
  - id: anvil
    type: openspec-schema
    enabled: true
    archiveUrl: https://codeload.github.com/jikkujoyce/openspec-schemas/tar.gz/73eea60c622712a5d952ec1aec62da4e349f8c33
    commit: 73eea60c622712a5d952ec1aec62da4e349f8c33
    archiveSha256: 62a94ccad4000982c8de93f5596ee0e778ef58a41797994568e546021eacd9d5
    treeSha256: 61250a6741799df17fe74c41ed23a95e2910ea3190fff2f6c0e8f66004a63767
    sourcePath: schemas/anvil
    target: anvil
    scope: user

bundlesBrief:              # 出厂 bundle 的短备注(非 manifest 管理的包)
  "@deepseek-ai/dsh-base": 核心 bundle(agent / 会话 / 工具骨架)
  "@deepseek-ai/dsh-web-app": web 壳(浏览器 UI)

customizations:
  # 字段约定:brief = 启动清单里的短备注(优先于 note);note = 完整来源/审查记录;
  #          name = 非 npm spec(github/tarball)时的真实包名(必填;npm spec 可省略)
  #          enabledEnv = 可选,声明后同名 DSH_ 环境变量(真值 1/true/yes/on、
  #            假值 0/false/no/off)覆盖本条目有效启用状态,未设置/无法识别时
  #            回退到 enabled;用于默认关闭、仅在有权限的机器上用 env 打开的
  #            定制(如内部专属包),与顶层 web / DSH_ 环境变量同一套真值/假值语义
  # 第三方(remote):只存 pin + 覆盖 + 记录,不 vendor 源码
  - id: cost-meter
    type: package
    source: remote
    spec: dsh-cost-meter@1.8.4
    version: 1.8.4
    enabled: true
    brief: 会话费用统计
    note: '第三方 https://github.com/Han-1413141/dsh-cost-meter(MIT,以 npm 元数据核对),纯 web client 插件。信任面:密钥(OpenCode Go/Coding Plan Key、火山 AK/SK、自定义余额占位符)只存 DSH 凭据库,设置页 write-only;余额/额度端点仅在用户启用对应 Provider 时出站,API Key 只发官方域名;customBalance.allowedHosts 未配置时放行并告警一次。升级复核:1.8.4 刻意不含 1.8.5 起的全局 fetch observer(与 OpenCode header 共存);核对 peer、出站域名并先做宿主冒烟。回滚:改回上一 pin(git 历史)→ dsh build;回到 1.7.x 须同时回退 DSH 到 0.1.5;验收失败则 enabled:false。 pin 校验 sha512-xtcidwjxRTchiKFTOci8z8UyNTxvabBzvWpRKCbVkOlqcl39fneEqyBPFrdVTEyioc88L45fZ8agoE509KTCAA=='
  - id: archify-dsh
    type: package
    source: remote
    spec: '@tt-a1i/archify-dsh@0.1.0'
    version: 0.1.0
    enabled: true
    brief: 架构图 skill(架构/时序/数据流/生命周期)
    note: '第三方 https://github.com/tt-a1i/archify(MIT)的 skill-only bundle:对话内生成可交互架构图(自包含 HTML/PNG/SVG);后续可配合 B001 架构师角色。升级复核:改 pin 前复读上游 skill 内容。移除:enabled:false → dsh build → 重启。'
  # 自研(local):首页空白会话首发启动到隔离 Git worktree。
  - id: worktree-session
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: Worktree Session 首发隔离(task branch/lean deps/独立 build home)
    note: '自研,spec source-workspace-worktree-session。首次普通发送时创建唯一 ws/* 分支与 .worktrees/* checkout,不切换主 checkout;npm/pnpm 默认 lean 依赖,变更依赖前须先 promote;.env.local 仅同步 Git 忽略的文件并写入隔离 DSH_HOME。已绑定会话的文件/搜索/Bash 限制在 worktree 内;ws 的显式 path 须用户一次性授权;clean 拒绝 dirty/未合入/活跃项,不删远端分支。概念参考 LaoYueHanNi/dsh-git-worktree(MIT,见 packages/worktree-session/NOTICE)。升级复核:每次 DSH 升级重做工具契约与生命周期接缝的回归审计。移除:enabled:false → dsh build。'
  # 自研(local):适配受管、版本化的官方 OpenSpec 会话工作流。
  - id: dsh-openspec
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 官方 OpenSpec Skills 与 commands 的受管 DSH adapter
    note: '自研适配器,spec dsh-openspec-session/-updates;上游为 @fission-ai/openspec 官方 CLI/templates(遵循其发布许可),先行作品见 NOTICE。信任面:仅请求无凭据的 npm registry latest 元数据(updateCheck 可关);受管 CLI 默认关闭遥测(telemetry: adapter-off)与自身更新检查,不传输会话、代码、路径或 provider 凭据;升级/回滚只经调用会话的 Bash 且须 --approve。升级复核:精确版本记在 packages/dsh-openspec/package.json 与根 lockfile(此处不写版本),升级前验证官方 renderer parity、CLI smoke、lockfile integrity。移除:enabled:false 后 dsh build,会话结束后手动删 generations 目录(v1 不 purge)。宿主层 Skill provider 会进入 Pet scope,见 BACKLOG.md D006。'
  # 自研(local):按知识域物理隔离、可跨库检索的 memex 持久记忆层 + 「记忆」设置页。
  - id: dsh-memex
    type: package
    source: local
    version: 0.3.0
    enabled: true
    enabledEnv: DSH_MEMEX_ENABLED  # 紧急熔断：设 DSH_MEMEX_ENABLED=0 即可在下次 build 时移除
    brief: memex 持久记忆原生接入(scope 隔离/跨库检索/守门 + 「记忆」设置页)
    # 本机运行前提:存储内核是**全局 npm 安装**——dsh build 不装它、个人同步清单
    # (dsh-sync)不带它、记忆库里也没有它,于是换机器/换账号/重建 DSH home/恢复
    # 记忆库之后内核必然缺失,表现为设置页「远端 不可用 / 详情 missing」且召回与
    # 写卡一起失败。声明在这里后,bin/dsh 在启动/构建/重启前自愈
    # (scripts/host-prerequisites.mjs);版本必须等于生成物里的 KERNEL_VERSION,
    # 由 tests/host-prerequisites.test.mjs 兜底防漂移。sync 只校验,从不安装。
    hostPrerequisites:
      - kind: npm-global
        package: "@touchskyer/memex"
        version: "0.4.1"
    note: '自研,spec dsh-memex-scope/-settings-ui/-card-browser(0.3.0 起工作区开关改为路径声明 workspaces)。依赖全局安装的内核 @touchskyer/memex@0.4.1(MIT,不改上游):由 hostPrerequisites 在 bin/dsh 启动前自愈(sync 只校验不安装),pin 须等于生成物 KERNEL_VERSION,全局安装需显式 --registry=https://registry.npmjs.org/。卡片浏览按需起内核 serve(配远端须 --local,注入 MEMEX_NO_OPEN,取 stdout 最后一个端口);跨机器注册方失败绝不回落本机地址。升级复核:内核 --init 的英文错误串(调用已注入 LC_ALL=C)与 serve 文本解析。回滚:enabled:false + sync(重启须脱离调用方进程);退到 0.2.0 前先把关闭开关写回条目级;紧急熔断 DSH_MEMEX_ENABLED=0。'
  # 自研(local):B013 sidebar 会话行前动态 provider logo
  - id: sidebar-session-provider-icon
    type: package
    source: local
    version: 0.1.2
    enabled: true
    brief: 侧边栏会话行当前选中模型品牌 logo(选择器即时切换)
    note: '自研,B013,spec sidebar-session-provider-icon。Web client 订阅官方 modelDirectories 的即时选择,Host provider projection 仅作冷历史 fallback;品牌 SVG 为随包落盘的固定来源(@lobehub/icons-static-svg@1.94.0 MIT;OpenCode 取自 anomalyco/opencode 固定 commit),不手绘、运行时不访问 CDN;不触碰官方 StateDot/时间/菜单/拖拽,DOM 定位失败静默降级,自身不发网络请求。升级复核:DSH 升级后回归 row-locator 对官方行 DOM 的假设。移除:enabled:false → dsh build → 重启。'
  # 自研(local):B018 会话标题旁 session id 短标识徽标(点击复制完整 id)
  - id: session-title-copy
    type: package
    source: local
    version: 0.1.2
    enabled: true
    brief: 标题右侧 6 位 session id 徽标(点击复制完整 id + toast;标题恢复官方)
    note: '自研,B018,spec session-title-copy(change session-title-id-badge)。Web client 订阅官方 sessions list(current 为 id 真相源),在标题旁插入 6 位 session id 徽标,点击复制完整 id;标题保持官方 disabled 原样。无 Host 能力、无网络请求、不读取会话内容;官方 DOM 变化或剪贴板被拒时静默降级。升级复核:官方标题区结构变化时只需改 src/client/title-locator.ts。移除:enabled:false → dsh build → 重启,无持久数据。'
  # 自研(local):B019 设置面板底部 DSH 主机系统时钟(24 小时制 + 时区)
  - id: system-clock
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 设置面板底部 DSH 主机系统时钟(24h + 时区 + hostname)
    note: '自研,B019,spec settings-system-clock。Host 经 Connection RPC /dsh-system-clock 暴露只读的主机时间/时区/hostname,Web 在设置面板底部渲染 24h 时钟,不可达时显式降级而不回退浏览器时间;无外部网络、不写入。⚠ 回环边界由 connection 层统一施加(非回环 Host 403、未认证 401);本部署未配置 trustedHosts,不得顺手添加,否则该通道随之放宽。升级复核:DSH 升级后回归 connection 的 Host fence。移除:enabled:false → dsh build → 重启。'
  # 自研(local):受限地区 × Claude 发送拦截(Web blocks + Host 出口国家码判定,双备份 Geo,未知 fail-closed)
  - id: home-network-model-guard
    type: package
    source: local
    version: 0.1.0
    enabled: true
    brief: 出口位于受限地区时禁用 Claude 系列模型发送(输入框禁用 + 原因文案)
    note: '自研,spec home-network-model-guard(change trusted-egress-claude-guard)。Host 经两个互为备份的 HTTPS Geo 服务判定 DSH 主机出口国家(默认阻断 CN,本地 config.json 可改),blocked/unknown 对 Claude 系列 fail-closed:Web 禁用输入框,Host 在 llm/stream 拒绝;非 Claude 不受影响。信任面:仅访问两个声明的 IP 归属服务,不探测 Anthropic/Cloudflare,不落盘 IP;通道仅回环可达(未配置 trustedHosts,不得添加)。含临时 composer min-height 补偿,运行体恢复最小高度后应删除。升级复核:blocks 共存语义与 llm/stream 门禁。移除:enabled:false → dsh build,门禁与提示全部卸载。'
  # 自研(local):DSH Pet 常驻桌宠 Agent 入口(Host+Web 双半区)
  - id: dsh-pet
    type: package
    source: local
    version: 0.1.0
    enabled: true
    # 仅长期 dsh web Host 使用的 Pet Locus 兼容运行时；build/plugin 等官方
    # CLI 仍按 dshVersion 走官方精确版本。版本变化必须重新审查，不自动套补丁。
    hostRuntimeCompatibility:
      kind: pet-unified-locus-v1
      supportedDshVersion: 0.2.0-rc.2
    brief: 常驻桌宠 Agent 入口(Pet Task/Invocation/可信来源快照/受管 Skill store)
    note: '自研,spec dsh-pet/pet-lark-channel/pet-locus-collaboration/pet-compat-minimization。Host+Web 双半区,状态在 $DSH_HOME/plugins/dsh-pet/(sqlite,与安装目录分离);不读取 provider 凭据,能力来自用户显式导入的 Skill。飞书入站默认关闭:凭据留在 lark-cli,allowlist 为空即不放行,入站防线均静默 fail closed;仅支持能证明 bot open_id 的 lark-cli(最低已验证 1.0.93),媒体下载要求官方 lark-cli --version 为 1.0.94,否则媒体不可用。compat overlay 只替换 @deepseek-ai/dsh-subagent(4 个 seam),dshVersion 变化必须重新审查,不自动套补丁;退役须上游发布全部四项能力(跟踪见 packages/dsh-pet/compat/subagent/README.md)。移除:enabled:false → dsh build → 重启。'
  - id: dsh-pet-executor
    type: preset
    version: 0.1.0
    enabled: true
    brief: Pet 执行会话专用 preset(不加载 skill-filesystem)
    note: '自研 preset,理由见 packages/dsh-pet/docs/adr/ADR-0001-executor-preset.md。与官方 standard 的唯一差别是移除 skill-filesystem(保留 tool-skill):dsh-skill 的 collectFresh 总会并入 global 层,provider 无法被减去,Pet 允许清单只能靠不加载它来保证。0.2+ 由 sync 渲染为 @deepseek-ai/dsh-agent-preset 声明行(id preset-dsh-pet-executor)。升级复核:官方 standard preset 变化时对照差异。移除:随 dsh-pet 一并 enabled:false。'
  - id: ws
    type: skill
    enabled: true
    brief: Worktree Session 的 ws 操作 skill(status/promote/clean)
    note: '自研 skill,配合 worktree-session 包,spec source-workspace-worktree-session。只对已证明归属的操作生效:调用会话的有效 Worktree Session 绑定、主 checkout 上的仓库级 clean,或解析出有效 operation 元数据的显式绝对路径;命名(.worktrees、ws/*、lean 等词)不构成归属证明,不绕过拒绝改用通用 git。升级复核:ws 工具参数或 binding 语义变化时同步 SKILL.md。移除:enabled:false → dsh build。'
  # Phase 1 Jev 流程路由:只做 shadow observation,不创建 change/切 schema/调用 ssf。
  - id: jev-workflow-router
    type: skill
    enabled: true
    brief: Jev 流程分流 shadow 评估(无自动副作用)
    note: '自研,spec jev-workflow-routing。仅在 Agent 已独立到达流程选择点后调用 pinned Jev MCP(见 thirdPartyResources jev,凭据由本机环境 TYPESAFE_API_KEY 提供,不入仓库);候选闭集 direct / 标准 OpenSpec / 原样 Anvil / 原样 spec-superflow;只做 shadow observation,无自动副作用;用户显式选择、existing change、安全门禁与 Worktree Session 始终优先;低置信度/失败均 needs-review,记录仅含本地有界特征。升级复核:Jev MCP pin 变化时重核候选与输出契约。移除:enabled:false → dsh build。'
  # 自研 skill:「统计一下召回」→ 跑 dsh-memex-recall-report 并按口径解读
  # 命令本身随 dsh-memex 包的 bin 分发(openspec 2026-09-24-memex-recall-report-cli);
  # 这里只提供触发词、定位命令的包装脚本与解读纪律。只读,不改卡片。
  - id: memex-recall-report
    type: skill
    enabled: true
    brief: memex 召回报告 skill(只读:空结果率/死卡/高频卡与建议)
    note: '自研 skill,change memex-recall-report-cli(2026-09-24 归档)。命令随 dsh-memex 包的 bin 分发,本 skill 只提供触发词、定位脚本与解读纪律。只读:读本机召回遥测与卡片文件名,不写文件、不联网、不改卡片。升级复核:dsh-memex 遥测格式或 bin 变化时回归 report.sh。移除:enabled:false → dsh build。'
  # 自研 skill:添加远端插件的标准流程
  - id: add-dsh-plugin
    type: skill
    enabled: true
    brief: 添加远端 DSH 插件的标准流程(写 manifest → build → 询问重启)
    note: '自研流程 skill:核实 npm 来源与源码仓库后,在 dsh.yaml 追加精确 pin(禁止 ^/~)的 remote 条目,dsh build,再询问是否重启;不擅自重启,build 失败即停。信任面:会用 npm view 访问 npm registry;第三方插件按第三方代码对待。升级复核:manifest 字段约定(含 brief/note 形态)变化时同步 SKILL.md。移除:enabled:false → dsh build。'
  # 自研 skill:移除插件的标准流程
  - id: remove-dsh-plugin
    type: skill
    enabled: true
    brief: 移除 DSH 插件的标准流程(删 manifest 条目 → build 卸载 → 询问重启)
    note: '自研流程 skill:从 dsh.yaml 删除整条目(不是 enabled:false)及对应 patches/<id>.yml,dsh build 卸载后询问是否重启;不擅自重启;重启前卸载不生效,属残留态而非失败。升级复核:sync 的卸载语义变化时同步 SKILL.md。移除:enabled:false → dsh build。'
  # 第三方 Skill 的 DSH 按需适配:只有用户显式调用时才启用该会话的 ADHD 友好输出模式
  - id: i-have-adhd
    type: skill
    enabled: true
