# zydsh 总配置 — DSH 定制的唯一开关面。
# 修改后运行 `dsh build`(或 `node scripts/sync.mjs`)物化到 ~/.dsh。
# 约定:禁用(enabled: false)≠删除;手改一律回写本仓库。

dshVersion: 0.1.0-rc.6     # 与 scripts/dsh.fish 的 DSH_VERSION 保持一致

customizations:
  # 第三方(remote):只存 pin + 覆盖 + 记录,不 vendor 源码
  - id: cost-meter
    type: package
    source: remote
    spec: dsh-cost-meter@1.5.6
    version: 1.5.6
    enabled: true
    note: 会话费用统计(web client 插件);仓库 https://github.com/Han-1413141/dsh-cost-meter;依赖拉到 rc.7 家族,重启后验证加载
