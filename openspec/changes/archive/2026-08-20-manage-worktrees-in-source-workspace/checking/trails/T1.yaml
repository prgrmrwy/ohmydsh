        result: pass
        result_detail: "Loop 2: ordinary message appeared once in the original Session with Worktree disabled; post-submit Git inventory contains only main checkout/main branch. Evidence: screenshots/loop2-T1-after.png, baselines/loop2-T1-after-api.json, baselines/loop2-T1-worktrees-after.txt."
        selector: "[data-testid='worktree-session-status'], [data-testid='conversation']"
