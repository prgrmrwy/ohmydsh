  execution_strategy:
    recommendation: single_only
    selected: single_agent
    reason:
      - 八条 trail 共享同一个正式验收群、同一 channel consumer 与同一持久 locus 状态
      - bind、scope、retire 与冷恢复存在严格顺序和共享写状态
      - bot-added 事件只能由一个有界监听者消费，禁止多 agent 竞争
