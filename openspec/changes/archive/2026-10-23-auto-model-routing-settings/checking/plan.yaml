    proposed_jev_attempt_ceiling: 10
    expected_main_model_requests: 12
    expected_child_model_requests: 1
    proposed_model_attempt_ceiling_including_retries: 20
    child_creation_ceiling: 1
    monetary_estimate: 无法预知精确金额或承诺美元上限；Jev经OpenRouter真实计费，模型消耗订阅/额度或计费由当前适配器决定。
    enforcement_limit: 这是执行预算而非宿主硬计数器；逐请求计数，出现额外自动请求立即停止新增动作/取消活跃回合，接近上限先暂停，绝不因缺证无限重试。
  restoration: 恢复前同时核验config及官方选择/默认未被并发修改；每个写入trail先快照原始非密钥配置字节/存在性/模式和官方选择与默认值；每步写后回读，每trail finally精确恢复基线；全局差异或并发修改不明时暂停不盲目覆盖。
  actual_request_evidence: 浏览器network不等于Host出站；request/header.config仅官方合成配置佐证，工具参数/芯片/会话header也不是provider线级请求。无已存在可关联的安全出站观察源则相关CP保留partial不得完整PASS。
  timing: 每trail180秒包含finally，120秒停止新动作并取消，保留60秒恢复；按execution-notes.md付费启动截止；无法绑定观察/恢复入口则不发送，超时blocked不自动重跑。
