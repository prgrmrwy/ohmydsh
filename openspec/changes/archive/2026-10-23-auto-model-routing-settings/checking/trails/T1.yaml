id: T1
name: 只读凭据、草稿、目录与criteria
description: CP01/02/20；设置页只编辑草稿，不保存，关闭丢弃后核验不变。
device: pc
parallel_group: A
conflicts_with: [T2, T9, T6, T3, T4, T10, T5, T7]
precondition: 用户已确认计划和执行策略；3080既有登录amr-accept；只读快照配置hash、官方当前/默认模型；不读取任何credential值。
ask_user_if_blocked: true
status: partial
blocked_reason: Loop2已真实执行并恢复；仍有线级或指定GUI子断言缺口，非原预检无入口。
mock_setup:
  required: false
  status: not_needed
  scenario_id: null
  surface: settings-key-and-routing-drafts
  data_source: settings-endpoint-and-official-catalog
  evidence: [mock-discovery.md:24-30]
  enable:
    command: null
    env: null
    notes: 真实env只读态已发现；本轮不启mock。
  user_decision: null
budget: 'Jev 0；模型0；不保存；不得调用setKey或selectModel。'
cleanup: 关闭设置并丢弃草稿；回读配置hash、官方选择与默认provider/model/effort均等于进入前快照；不靠模型请求恢复。
timing:
  hard_limit_seconds: 180
  stop_new_actions_at_seconds: 120
  cleanup_reserve_seconds: 60
  rule: 从进入trail开始计时；前置只读绑定与恢复入口确认后才准写入。120秒停止新动作并取消活跃回合，finally恢复；180秒前未证实恢复则blocked并停止全部后续trail，不重跑。
  paid_chain_admission: 最迟60秒启动唯一付费链路；未完成配置/观察绑定则不发送，余项blocked。T5最多三段短链，分别须在30/60/90秒前启动；任何链未结束不启动下一段。
steps:
  - seq: 1
    description: 从唯一GUI入口打开设置的自动模型路由区；观察只读key字段与settings响应白名单
    action: navigate
    target: http://127.0.0.1:3080/
    value: null
    url_needs_input: false
    checkpoints:
      - id: CP01
        description: 打开设置后key状态包含env只读，输入禁用为空，不回传key值
        focus: integration
        verify: assert_network
        automation: full
        data_scenario_required: false
        surface: settings-key-and-routing-drafts
        data_source: settings-endpoint
        mock_scenario_id: null
        expected_source: 'user-confirmed-CP01; delta-spec:271,285,347-350'
        expected_unverified: false
        input_method: default
        class: deterministic
        expected_url: /api/auto-model-routing.settings
        expected_method: POST
        expected_params: {}
        expected_status: 200
        expected_response:
          key:
            configured: true
            source: env
            writable: false
        reviewer_notes: 同时断言#amr-key disabled且value为空；settings响应key只含状态元数据，不包含value字段；不打印完整响应、不读取key值作字符串匹配、不尝试迁移或setKey。若当前env状态已变，暂停核验前提，不私自改来源。
        result: pass
        result_detail: Loop2复核env只读、key输入disabled且空；settings仅状态字段，未调用setKey。 详见execution-facts.md Loop2。
  - seq: 2
    description: Claude页选Opus编辑simple=medium草稿，切Fable、GPT、再回Opus；关闭前后核验官方当前及默认模型
    action: click
    target: '.amr-settings #amr-tab-claude; button[aria-label="主会话模型"]; #amr-tab-codex'
    value: Claude/Opus/simple=medium-draft-only
    url_needs_input: false
    checkpoints:
      - id: CP02
        description: 切页和编辑模型后草稿回显medium，真实会话与默认模型未更新
        focus: interaction
        verify: assert_dom
        automation: full
        data_scenario_required: false
        surface: settings-routing-drafts
        data_source: official-model-directory-and-selection
        expected_source: 'user-confirmed-CP02; delta-spec:273,297-300'
        expected_unverified: false
        input_method: default
        class: deterministic
        selector: '.amr-settings [data-tier="simple"]'
        expected_text: Medium
        expected_attrs: null
        expected_visible: true
        reviewer_notes: 对照前快照官方当前及新会话默认provider/model/effort，不只看设置trigger；观察窗口无selectModel RPC；两页各改一格并来回核对草稿，所有草稿最终丢弃，不保存。若medium本已显式相同，选择另一合法且可区分值并记录test setup，不改变oracle。
        result: manual
        result_detail: partial：Claude/Haiku和GPT/Sol的simple草稿均改medium，切页后保留，关闭丢弃；config hash及官方default不变。未完成指定Opus/Fable编辑模型切换，不能完整PASS。 详见execution-facts.md Loop2。
  - seq: 3
    description: 四档info逐一hover/focus并打开两体系主模型及子模型/effort菜单；检查有效候选和退出菜单后不提交
    action: hover
    target: '.amr-settings-info; .amr-settings-tier button[aria-label]'
    value: all-four-tiers-and-both-providers
    url_needs_input: false
    checkpoints:
      - id: CP20
        description: tooltip原文与criteria完全一致；列表包含且仅包含对应目录/允许集合和有效effort
        focus: interaction
        verify: assert_dom
        automation: full
        data_scenario_required: false
        surface: settings-info-and-route-menus
        data_source: settings-criteria-catalog-and-childAllowlist
        expected_source: 'user-confirmed-CP20; delta-spec:271-279,332-335'
        expected_unverified: false
        input_method: default
        class: deterministic
        selector: '[role="tooltip"], [role="menu"]'
        expected_text: 四档tooltip逐字等于rubric.tier.criteria；模型/effort列表逐项集合相等
        expected_attrs: null
        expected_visible: true
        reviewer_notes: rubric.json是唯一已接受规则来源；settings.criteria与磁盘rubric原文交叉，tooltip不得中文转述。主菜单=该provider目录，子菜单=该provider目录∩当前enabled白名单；effort=实际模型支持∩自动集合∩cap，无max。检查收起/展开模型与effort，不能presence-only。当前全7模型允许且能力相同，不声称验证了CP22/23或主/子差集。
        result: manual
        result_detail: partial：真实7模型/允许7集合及四级effort菜单已观察；simple tooltip既有观察、未完成全部四档tooltip及两体系主子全菜单集合，不能完整PASS。 详见execution-facts.md Loop2。
