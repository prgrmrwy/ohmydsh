ask_user_if_blocked: true
status: partial
blocked_reason: Loop2已真实执行并恢复；仍有线级或指定GUI子断言缺口，非原预检无入口。
mock_setup:
  required: false
  status: not_needed
  scenario_id: null
  surface: fresh-and-self-created-old-sessions
  data_source: defaultMode-and-routing-state
  evidence: [mock-discovery.md:43]
  enable:
    command: null
    env: null
    notes: 仅使用本次新建普通验收会话，配置临时真实写入。
  user_decision: null
budget: Jev主1，MANUAL工具不应Jev；主模型预计4（S_old物化1、新AUTO1、MANUAL工具及收尾2），child0，不实际派发。
cleanup: 修改默认每步回读，结束立即恢复S_T和官方默认模型；本次会话切MANUAL，取消活跃回合，不删历史会话，不重启验证。
timing:
  hard_limit_seconds: 180
  stop_new_actions_at_seconds: 120
  cleanup_reserve_seconds: 60
  rule: 从进入trail开始计时；前置只读绑定与恢复入口确认后才准写入。120秒停止新动作并取消活跃回合，finally恢复；180秒前未证实恢复则blocked并停止全部后续trail，不重跑。
  paid_chain_admission: 最迟60秒启动唯一付费链路；未完成配置/观察绑定则不发送，余项blocked。T5最多三段短链，分别须在30/60/90秒前启动；任何链未结束不启动下一段。
