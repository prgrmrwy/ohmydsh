id: T7
name: Delivery 决策往返与私聊隔离
description: 在真实防腐任务流程中验证同一 child 的多消息 FIFO、飞书决策后续轮次，以及 GUI 私聊不继承当前飞书回复授权。
device: pc
parallel_group: G7
conflicts_with: [T1, T2, T3, T4, T5, T6, T8]
precondition: 选择一个 active、read、空闲的验收 Locus；已记录其 child session ID；浏览器可从 Locus 管理打开该 child。
ask_user_if_blocked: true
status: passed
blocked_reason_history: "曾阻塞于 T7-C3：从管理面打开 Locus 子会话失败。Pet 使用 ctx.sessions.open(sessionId)，而官方对 origin=subagent 的会话刻意拒绝普通 session 地址（session/agent-busy），正确入口是 openSubagent({parentSessionId, childSessionId, mode})。同时子会话标题被投递样板覆盖（fallback 取首条消息开头），在 GUI 中无法辨识。两处缺陷记为 B032，修复后可原地恢复 C3。C1/C2 已通过，不受影响。"
mock_setup:
  required: false
  status: not_needed
  scenario_id: null
  surface: feishu-child-interaction
  data_source: Delivery ledger, child inbox and Feishu replies
  evidence: []
  enable:
    command: null
    env: null
    notes: 使用真实消息和现有 GUI，不启用 mock。
  user_decision: null
steps:
  - seq: 1
    description: 用户快速连续发送两条 mention 消息，在 child 会话和诊断中等待两条均结算
    action: wait_for
    target: "user-action:send-two-mentions-in-order"
    value: "第一条：@Bot 记住顺序一；第二条：@Bot 记住顺序二并说明先后"
    url_needs_input: false
    checkpoints:
      - id: T7-C1
        description: 两条消息各有唯一 Delivery 和 inbox UUID，按接受顺序进入同一 child，均终态且没有错配或重复结算
        focus: integration
        verify: assert_dom
        automation: full
        data_scenario_required: true
        data_scenario: fifo-two-messages
        surface: feishu-child-interaction
        data_source: Delivery diagnostics and child session log
        mock_scenario_id: null
        expected_source: openspec
        expected_unverified: false
        input_method: default
        class: deterministic
        reviewer_notes: 以 messageId→Delivery→inbox UUID→turn 链核对顺序，不以 Bot 回复先后文本单独证明。
        selector: .dshpet-settings
        expected_text: "2 条不同 Delivery；同一子会话；接受顺序一致；2 条已结算；无重复 inbox"
        expected_attrs: null
        expected_visible: true
        result: pass
        result_detail: "真实快速连发两条群级 mention：两条各有唯一 Delivery（sequence 10/11）、唯一 messageId（om_...aca11a51 / om_...a4139cd4）、唯一 inbox UUID（91939c7e / e7f11736），按接受顺序进入同一 child session-c9af096f 的 turn 4 与 turn 5，均 settled，无错配或重复结算。严格串行的硬证据：第二条 00:52:12.476 即已 accepted/queued，但直到第一条所在 turn 4 结束的同一毫秒（00:52:24.853）才开始 turn 5。语义证据：第二条回复准确引用了第一条的 messageId 与内容（「问的是『现在几点』」），乱序或错配都无法作答。"
  - seq: 2
    description: 让 child 在真实防腐任务中遇到无法自行判定的点并提问，再由用户在飞书答复
    action: wait_for
    target: "user-action:decision-roundtrip"
    value: "@Bot README.md 第 114-116 行描述 rush init-vitest 会生成 index.test.ts / react.test.tsx / setupTests.tsx，请核对是否仍然准确；不确定就先问我，不要擅自改。"
    url_needs_input: false
    checkpoints:
      - id: T7-C2
        description: 用户回答作为同一 child 的后续普通轮次继续并完成，未创建飞书 Invocation 或 waiting-user 执行链
        focus: integration
        verify: assert_dom
        automation: full
        data_scenario_required: true
        data_scenario: decision-roundtrip
        surface: feishu-child-interaction
        data_source: Child inbox/session and legacy model diagnostics
        mock_scenario_id: null
        expected_source: openspec
        expected_unverified: false
        input_method: default
        class: deterministic
        reviewer_notes: 记录提问前后 child ID；回答必须形成新 Delivery 到同 child，并核对旧 Invocation/Task 表数量不增加。澄清点来自真实仓库事实（该命令模板的真相源不在仓库内，child 无法自行判定），不是为触发往返而硬造的提问。
        selector: .dshpet-settings
        expected_text: "同一子会话；后续轮次已结算；无飞书 Invocation；无 waiting-user"
        expected_attrs: null
        expected_visible: true
        result: pass
        result_detail: "澄清往返完成且上下文连续：提问轮 seq 13 / turn 7 settled，用户答复 seq 14 / turn 8 settled，同为 child session-c9af096f，turn 号连续递增，未新建 child。turn 8 直接接住 turn 7 的调研结论给出定稿文案（未重新提问、未丢失上下文），证明答复是作为同一 child 的后续普通轮次继续，而非另起执行链。旧模型表在整条 trail 期间零增长（invocations 56、tasks 15、invocation_channel 46，与基线逐项一致），未创建飞书 Invocation 或 waiting-user 分支。pet_locus_reply 累计 8 次调用 0 次被拒。附带观察：子会话在 read 权限下主动声明「无法直接改 README，请你自己粘贴或换有写权限的会话」，如实报告权限边界而未尝试硬改。"
  - seq: 3
    description: 从 Locus 管理打开该 child，在 GUI 中直接发送不含飞书回复请求的私聊消息
    action: click
    target: "button:has-text('打开子会话')"
    value: null
    url_needs_input: false
    checkpoints:
      - id: T7-C3
        description: GUI 私聊在同一 child 产生本地轮次，但飞书群消息数量不更新且 pet_locus_reply 当前轮授权不可用
        focus: integration
        verify: assert_dom
        automation: full
        data_scenario_required: true
        data_scenario: gui-private-turn
        surface: dsh-child-conversation
        data_source: DSH child session and Feishu chat history
        mock_scenario_id: null
        expected_source: openspec
        expected_unverified: false
        input_method: default
        class: deterministic
        reviewer_notes: 点击后还需在 GUI 输入并发送“仅在 GUI 回答”；联合群消息前后数量和 tool 可用性证明无飞书出站。
        selector: .dsh-conversation, main
        expected_text: "仅在 GUI 回答；本地轮次完成；飞书消息数量未更新；当前飞书回复授权不可用"
        expected_attrs: null
        expected_visible: true
        result: pass
        result_detail: "首次 BLOCKED（2026-09-13，事实保留）：无法从管理面打开该 child——Pet 使用 ctx.sessions.open(bare id)，而 Host 对 origin=subagent 刻意拒绝（session/agent-busy），且子会话标题被投递样板覆盖导致 GUI 中不可辨识。两处缺陷记为 B032。\n重测 PASS（2026-09-13，修复 B032 后原地恢复）：打开路径改走 openSubagent({parentSessionId, childSessionId, mode: continuable})，用户确认可正常打开。随后在 GUI 中发送不含飞书回复请求的私聊「现在是什么权限？」，三项判据全部成立——(1) 在同一 child session-c9af096f 产生本地 turn 9（01:35:52→01:36:02 completed），输入 source.kind=user；(2) 飞书侧零投递，Delivery 总数保持 14 条未变，无新增记录；(3) 该轮无 Delivery 绑定，pet_locus_reply 调用数保持 8 次未变，当轮授权不可用。附带观察：模型在回复中自述「可以回复飞书消息」，但实际该轮并无授权——隔离由 Host 侧强制，不依赖模型自觉。本项同时交叉验证 10.10 的授权判定修复未放宽错边界：未决claim 已不再 sticky 置 mixed，但 GUI 轮次依然拿不到回复授权。"
