# Publishes this plugin to npm when a version tag is pushed.
#
# Uses npm trusted publishing (OIDC): no long-lived npm token exists anywhere,
# and provenance is generated automatically. Configure the npm side once at
# https://www.npmjs.com/package/dsh-sidebar-session-provider-icon → Settings →
# Trusted Publisher → GitHub Actions, with:
#   repository        prgrmrwy/dsh-sidebar-session-provider-icon
#   workflow filename release.yml
#   environment       (leave empty)
#
# Requirements: npm CLI >= 11.5.1 and Node >= 22.14.0 (see
# https://docs.npmjs.com/trusted-publishers/), hence the explicit npm upgrade
# below — publishing also resolves `prepare`/`prepack`, which build lib/.
#
# Cutting a release: bump `version` in package.json, commit, then
# `git tag v<version> && git push origin v<version>`. The tag must match the
# package version, or the check step below fails before anything is published.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.15.0
          npm --version
          echo "registry: $(npm config get registry)"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish
