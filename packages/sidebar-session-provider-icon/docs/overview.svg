<rect width="1200" height="660" fill="#f8fafc"/>
<text x="40" y="52" font-family="DejaVu Sans, Verdana, sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="start">Sidebar session icons: see which model each chat uses</text>
<text x="40" y="80" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">Every row gets a badge for the model selected in that session. It updates the moment you switch.</text>
