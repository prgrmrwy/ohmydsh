# DSH Pet Host entry. The package also declares a Web client bundle.
#
# Pet registers its OWN storage backend and routes ONLY its own `dsh-pet`
# domain to it. Every other DSH domain keeps the profile's default backend:
# `storage-domain.routes` is an override map, not a replacement.
#
# Why a Pet-owned backend rather than the official `storage-sqlite`:
# Pet needs atomic multi-table commits (a locus publication, an inquiry ledger
# row and an outbox row must land together) and single-writer ownership of the
# medium. Neither is in the official backend, and both used to be added by
# patching four upstream packages — which kept `storage`, `storage-domain`,
# `storage-json` and `storage-sqlite` permanently inside Pet's compatibility
# overlay and forced 32 hunks to be re-derived on every DSH version bump.
#
# `@deepseek-ai/dsh-storage` exports the backend contract and its registry
# precisely so a consumer can do this, and documents routing as the consumer's
# own configuration. So Pet implements `StorageBackend` itself and upstream
# stays untouched. Everything above the backend — schema validation, domain
# versioning and migration, the in-memory view, `domain/changed` — remains the
# official `storage-domain` layer's job.
#
# This row must load BEFORE `storage-domain`: the domain layer injects
# `storageBackendServiceKey('pet-sqlite')` and cannot resolve the route until
# this row provides it. It is a separate row from `dsh-pet` for the same
# reason — the Pet row injects `storageDomain`, so providing the backend from
# there would make the dependency graph circular and neither would ever load.
- insert:
    - id: dsh-pet-storage
      name: dsh-pet/storage
      inject:
        - storage
      config:
        # Pet state lives under the ACTIVE DSH home, never in the package
        # checkout or the generated profile, so plugin upgrades and profile
        # rebuilds never overwrite Pet task data. `dshHomePath` is the same
        # loader helper the base Web profile uses for `storage-json`, so a
        # `$DSH_HOME` override moves Pet state with the rest of the harness.
        path: !!js dshHomePath('plugins', 'dsh-pet', 'state.sqlite')
# A patch row is a top-level entry naming the row it overrides by `id`; a
# `patch:` wrapper is not a thing and fails composition with
# "id is required for non-insert patches".
#
# A patch REPLACES the targeted row's whole `config`, so `backend: json` is
# restated here — omitting it would drop the profile default and leave every
# other DSH domain unrouted.
- id: storage-domain
  config:
    backend: json
    routes:
      # MUST equal PET_DOMAIN_NAME in src/host/spec.ts. DSH's UNIT_NAME_RE
      # forbids hyphens, so the domain (and this route key) is `dsh_pet`;
      # a mismatch would silently leave Pet on the profile's JSON backend.
      #
      # The value MUST equal PET_BACKEND_NAME in src/host/storage/backend.ts.
      # Routing is by name, so a typo here does not fail loudly — it silently
      # sends Pet's records to the profile's default JSON backend, which has
      # neither atomic batches nor single-writer ownership.
      dsh_pet: pet-sqlite
- insert:
    - id: dsh-pet
      name: dsh-pet
      inject:
        # `storage` is needed alongside `storageDomain`: the backend ownership
        # proof reads the hub's backend registry, and cordis denies property
        # access to any service the plugin does not declare.
        - storage
        - storageDomain
        - workspaceRegistry
        - sessions
        - sessionController
        - sessionTitle
        - llm
        - agentDefaultModel
        - agentPresets
        - agents
        - tools
        - skills
        # NOTE: `shellEnv` is deliberately NOT injected. Listing it here makes
        # it REQUIRED — the plugin fiber would wait for it and Pet would never
        # load on a Host without the registry. It is read through `ctx.get` in
        # `src/index.ts` instead, so an absent registry simply means no
        # `DSH_PET_*` injection.
        - webServer
        # host-webserver deliberately has no Harness auth concepts. Pet's raw
        # management routes must pass Connection's signed browser-cookie fence.
        - connection
