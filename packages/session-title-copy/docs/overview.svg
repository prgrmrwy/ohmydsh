<text x="80" y="191" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="start">demo-app  /  Health-check endpoint</text>
<text x="60" y="246" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">The title is shown, but there is no way to get the</text>
<text x="60" y="266" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">session id for scripts, logs or bug reports.</text>
