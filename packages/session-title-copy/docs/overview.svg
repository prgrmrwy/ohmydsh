<text x="1038" y="189" font-family="DejaVu Sans Mono, monospace" font-size="14" font-weight="bold" fill="#3730a3" text-anchor="middle">9af69b</text>
<text x="660" y="246" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">The badge shows the first 6 characters of the id.</text>
<text x="660" y="266" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">The title itself stays official and unchanged.</text>
