<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">Session title copy overview</title>
<desc id="d">A short six-character session id badge sits next to the conversation title; one click copies the full session id and shows a short confirmation.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<rect width="1200" height="660" fill="#f8fafc"/>
<text x="40" y="52" font-family="DejaVu Sans, Verdana, sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="start">Session title copy: grab the session id in one click</text>
<text x="40" y="80" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">A small badge next to the title shows the first six characters. Click it to copy the full id.</text>
<rect x="40" y="110" width="520" height="200" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
