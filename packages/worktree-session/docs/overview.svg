<?xml version="1.0" encoding="UTF-8"?>
<!-- Illustration source for packages/worktree-session/README.md. Synthetic text only. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">Worktree Session overview</title>
<desc id="d">A first message in a Git-backed DSH session creates an isolated task branch and a .worktrees checkout; the main checkout stays untouched.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
</defs>
<rect width="1200" height="660" fill="#f8fafc"/>
<text x="40" y="52" font-family="DejaVu Sans, Verdana, sans-serif" font-size="26" font-weight="bold" fill="#0f172a" text-anchor="start">Worktree Session: one task, one branch, one checkout</text>
<text x="40" y="80" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">The first message of a blank Git-backed session sets up an isolated workspace. Your main checkout is never touched.</text>
<rect x="40" y="110" width="330" height="330" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="140" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">DSH session (blank, Git-backed)</text>
<rect x="60" y="160" width="290" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="76" y="188" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="start">You</text>
<text x="76" y="210" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Add a health-check endpoint</text>
<rect x="60" y="290" width="290" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="74" y="315" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#64748b" text-anchor="start">Ask the agent...</text>
<rect x="300" y="297" width="44" height="26" rx="7" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="322" y="315" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Send</text>
<rect x="60" y="350" width="149" height="24" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
<text x="134.5" y="365.85" font-family="DejaVu Sans Mono, monospace" font-size="11" font-weight="bold" fill="#166534" text-anchor="middle">ws/add-health-check</text>
<rect x="228" y="350" width="48" height="24" rx="12" fill="#fef9c3" stroke="#fde047" stroke-width="1.2"/>
<text x="252.0" y="366.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="bold" fill="#854d0e" text-anchor="middle">lean</text>
<rect x="282" y="350" width="63" height="24" rx="12" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.2"/>
<text x="313.5" y="366.2" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="bold" fill="#3730a3" text-anchor="middle">active</text>
<text x="60" y="400" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="normal" fill="#64748b" text-anchor="start">Input-area status: task branch · mode · state</text>
<line x1="372" y1="200" x2="430" y2="200" stroke="#059669" stroke-width="3" marker-end="url(#ag)"/>
<text x="400" y="186" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">send</text>
<rect x="432" y="110" width="330" height="330" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="452" y="140" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Worktree Session prepares</text>
<circle cx="466" cy="181" r="13" fill="#2563eb" stroke="none" stroke-width="0"/>
<text x="466" y="186" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="490" y="186" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Create a unique ws/* task branch</text>
<circle cx="466" cy="237" r="13" fill="#2563eb" stroke="none" stroke-width="0"/>
<text x="466" y="242" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="490" y="242" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Add a .worktrees/&lt;task&gt; checkout</text>
<circle cx="466" cy="293" r="13" fill="#2563eb" stroke="none" stroke-width="0"/>
<text x="466" y="298" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="490" y="298" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Bind this same session to it</text>
<circle cx="466" cy="349" r="13" fill="#2563eb" stroke="none" stroke-width="0"/>
<text x="466" y="354" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="490" y="354" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="normal" fill="#0f172a" text-anchor="start">Submit your message exactly once</text>
<text x="452" y="420" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">No new workspace, no new session.</text>
<line x1="764" y1="200" x2="822" y2="200" stroke="#059669" stroke-width="3" marker-end="url(#ag)"/>
<rect x="824" y="110" width="336" height="330" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="844" y="140" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Repository: demo-app</text>
<rect x="844" y="160" width="296" height="100" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="860" y="186" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="start">Main checkout</text>
<text x="860" y="208" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">branch: main</text>
<text x="860" y="232" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Your uncommitted work stays here,</text>
<text x="860" y="250" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">never switched or reset.</text>
<rect x="844" y="290" width="296" height="128" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
<text x="860" y="316" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8" text-anchor="start">Task worktree</text>
<text x="860" y="338" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="start">.worktrees/add-health-check</text>
<text x="860" y="360" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="normal" fill="#1e3a8a" text-anchor="start">branch: ws/add-health-check</text>
<text x="860" y="386" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="start">Agent edits, tests and commits</text>
<text x="860" y="404" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#334155" text-anchor="start">here. Tools are confined to it.</text>
<path d="M992,262 L992,288" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ah)"/>
<text x="1004" y="280" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="normal" fill="#64748b" text-anchor="start">git worktree</text>
<rect x="40" y="480" width="1120" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="508" font-family="DejaVu Sans, Verdana, sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">Dependencies: fast by default, full install only on request</text>
<rect x="60" y="524" width="300" height="86" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
<text x="76" y="550" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#854d0e" text-anchor="start">lean (default)</text>
<text x="76" y="572" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">node_modules is a link to a shared</text>
<text x="76" y="590" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">cache: ready in moments</text>
<line x1="362" y1="567" x2="478" y2="567" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="420" y="555" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">ws promote</text>
<text x="420" y="590" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" font-weight="normal" fill="#64748b" text-anchor="middle">before install/update</text>
<rect x="480" y="524" width="300" height="86" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="496" y="550" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#065f46" text-anchor="start">mutable</text>
<text x="496" y="572" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">full npm ci / pnpm install done;</text>
<text x="496" y="590" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">dependency changes allowed</text>
<rect x="830" y="524" width="310" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="846" y="550" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="start">Safe cleanup</text>
<text x="846" y="572" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">Dry run first. Dirty, unmerged or</text>
<text x="846" y="590" font-family="DejaVu Sans, Verdana, sans-serif" font-size="13" font-weight="normal" fill="#475569" text-anchor="start">active worktrees are refused.</text>
</svg>
