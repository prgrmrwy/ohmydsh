# Worktree Session Host entry. The package also declares a Web client bundle.
- insert:
    - id: worktree-session
      name: dsh-worktree-session
      inject:
        - workspaceRegistry
        - storageDomain
      config:
        # Exact audited Host composition: base `subagent` uses
        # backgroundMode=continuable. One-shot fork/codex tools are excluded.
        continuableDelegationTools:
          - subagent
