# dsh-session-id-copy bundle patch
#
# Mounts the Web client plugin as a profile bundle row: each DSH web client
# then loads `./client` (via the package's `dsh.client` declaration), locates
# the current session title in the official conversation header and adds a
# short session id badge that copies the full id on click.
#
# This is the `dsh.bundle.patch` layer declared in package.json; the ohmydsh
# manifest (source: local) appends `dsh-session-id-copy` to the bundle stack
# automatically.
- insert:
    - id: dsh-session-id-copy
      name: dsh-session-id-copy
