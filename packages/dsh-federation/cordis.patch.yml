# Federated DSH Host entry. The package remains disabled in dsh.yaml until M3.
# The existing official `connection` row keeps its package identity; sync pins
# that package name to this bundle's fixed-source compatibility artifact while
# federation is enabled, and removes the pin on rollback.
- insert:
    - id: dsh-federation
      name: dsh-federation
      inject:
        - webServer
        - connection
