# Publishes this plugin to npm when a version tag is pushed.
#
# Uses npm trusted publishing (OIDC): no long-lived npm token exists anywhere,
# and provenance is generated automatically. Configure the npm side once at
# https://www.npmjs.com/package/dsh-sidebar-session-provider-icon → Settings →
# Trusted Publisher → GitHub Actions, with:
#   repository        prgrmrwy/dsh-sidebar-session-provider-icon
#   workflow filename release.yml
#   environment       (leave empty)
#
# Requirements: npm CLI >= 11.5.1 and Node >= 22.14.0 (see
# https://docs.npmjs.com/trusted-publishers/), hence the explicit npm upgrade
# below — publishing also resolves `prepare`/`prepack`, which build lib/.
#
# Cutting a release: bump `version` in package.json, commit, then
# `git tag v<version> && git push origin v<version>`. The tag must match the
# package version, or the check step below fails before anything is published.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.15.0
          npm --version
          echo "registry: $(npm config get registry)"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Publish
        run: |
          # A tag may be backfilled for a version that is already on npm.
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-sidebar-session-provider-icon@$version" version >/dev/null 2>&1; then
            echo "Version $version is already published; nothing to publish."
          else
            npm publish
          fi
      - name: Create GitHub Release with the published npm artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          # Download the registry artifact so GitHub and npm distribute identical bytes.
          assets="$(mktemp -d)"
          # A fresh publish can take minutes to become downloadable; retry before failing.
          for attempt in $(seq 1 20); do
            if npm pack "$name@$version" --ignore-scripts --pack-destination "$assets" --silent; then break; fi
            if [ "$attempt" = 20 ]; then echo "npm tarball for $name@$version still unavailable" >&2; exit 1; fi
            sleep 30
          done
          node --input-type=module - "$version" "$assets/notes.md" <<'NODE'
          import fs from 'node:fs'
          const [version, output] = process.argv.slice(2)
          // Headings may carry a date suffix ("## 1.2.3 — 2026-01-01"); the section ends at the next "## ".
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n')
          const start = lines.findIndex(l => l === `## ${version}` || l.startsWith(`## ${version} `))
          if (start < 0) throw new Error(`No changelog entry for ${version}`)
          const end = lines.findIndex((l, i) => i > start && l.startsWith('## '))
          const section = lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim()
          if (!section) throw new Error(`Empty changelog entry for ${version}`)
          fs.writeFileSync(output, section + '\n')
          NODE
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$version" --notes-file "$assets/notes.md"
          fi
          gh release upload "$tag" "$assets/$name-$version.tgz" \
            --repo "$GITHUB_REPOSITORY" --clobber
