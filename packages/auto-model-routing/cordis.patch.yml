- insert:
    - id: dsh-auto-model-routing
      name: dsh-auto-model-routing
    - id: auto-model-routing-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: auto-model-routing-plugin
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-auto-model-routing/package.json')), 'skills')
