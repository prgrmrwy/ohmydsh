name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.15.0
      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify
        run: npm run typecheck && npm test
      - name: Publish
        run: |
          # A manually bootstrapped version already exists when its first tag is created.
          version="$(node -p "require('./package.json').version")"
          published="$(mktemp)"
          npm view dsh-magpie-connector versions --json > "$published"
          if node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync(process.argv[2])); process.exit([v].flat().includes(process.argv[1]) ? 0 : 1)' "$version" "$published"; then
            echo "Version $version is already published; nothing to publish."
          else
            npm publish --access public
          fi
      - name: Create GitHub Release with the published npm artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          # Download the registry artifact so GitHub and npm distribute identical bytes.
          assets="$(mktemp -d)"
          npm pack "$name@$version" --ignore-scripts --pack-destination "$assets" --silent
          node --input-type=module - "$version" "$assets/notes.md" <<'NODE'
          import fs from 'node:fs'
          const [version, output] = process.argv.slice(2)
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          const section = changelog.split(`## ${version}\n`)[1]?.split('\n## ')[0]?.trim()
          if (!section) throw new Error(`No changelog entry for ${version}`)
          fs.writeFileSync(output, section + '\n')
          NODE
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$version" --notes-file "$assets/notes.md"
          fi
          gh release upload "$tag" "$assets/$name-$version.tgz" \
            --repo "$GITHUB_REPOSITORY" --clobber
