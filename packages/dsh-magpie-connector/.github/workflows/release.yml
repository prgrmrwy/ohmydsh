name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag to publish under (default: latest)'
        required: false
        default: latest

permissions:
  contents: write
  id-token: write
  # The release report comments on Issues the release refs.
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The release report reads commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.15.0
      - name: Check tag and package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify
        run: npm run typecheck && npm test
      - name: Publish
        run: |
          # A manually bootstrapped version already exists when its first tag is created.
          version="$(node -p "require('./package.json').version")"
          published="$(mktemp)"
          npm view dsh-magpie-connector versions --json > "$published"
          if node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync(process.argv[2])); process.exit([v].flat().includes(process.argv[1]) ? 0 : 1)' "$version" "$published"; then
            echo "Version $version is already published; nothing to publish."
          else
            # Explicit --tag keeps the normal default (latest) but allows deliberately
            # publishing a lower version as latest after a mistaken higher release.
            npm publish --access public --tag "${{ inputs.dist_tag || 'latest' }}"
          fi
      - name: Create GitHub Release with the published npm artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          # Download the registry artifact so GitHub and npm distribute identical bytes.
          assets="$(mktemp -d)"
          # A fresh publish can take minutes to become downloadable; retry before failing.
          for attempt in $(seq 1 20); do
            if npm pack "$name@$version" --ignore-scripts --pack-destination "$assets" --silent; then break; fi
            if [ "$attempt" = 20 ]; then echo "npm tarball for $name@$version still unavailable" >&2; exit 1; fi
            sleep 30
          done
          node --input-type=module - "$version" "$assets/notes.md" <<'NODE'
          import fs from 'node:fs'
          const [version, output] = process.argv.slice(2)
          // Headings may carry a date suffix ("## 1.2.3 — 2026-01-01"); the section ends at the next "## ".
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split('\n')
          const start = lines.findIndex(l => l === `## ${version}` || l.startsWith(`## ${version} `))
          if (start < 0) throw new Error(`No changelog entry for ${version}`)
          const end = lines.findIndex((l, i) => i > start && l.startsWith('## '))
          const section = lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim()
          if (!section) throw new Error(`Empty changelog entry for ${version}`)
          fs.writeFileSync(output, section + '\n')
          NODE
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$version" --notes-file "$assets/notes.md"
          fi
          gh release upload "$tag" "$assets/$name-$version.tgz" \
            --repo "$GITHUB_REPOSITORY" --clobber
      # Commits reference Issues as `Refs <owner>/<repo>#<n>` (never closing keywords),
      # so Issues stay open until here. Hand each still-open one to Bebop to verify
      # the release and report back to the reporter.
      - name: Collect Issues referenced since the previous release
        id: refs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          range="${previous:+$previous..}$GITHUB_REF_NAME"
          refs="$(git log "$range" --format=%B \
            | grep -oiE "refs:? +$GITHUB_REPOSITORY#[0-9]+" | grep -oE '[0-9]+$' | sort -un | tr '\n' ' ')"
          echo "Issues referenced in $range: ${refs:-none}"
          echo "issues=$refs" >> "$GITHUB_OUTPUT"
      - name: Hand referenced Issues to Bebop
        if: startsWith(github.ref, 'refs/tags/v') && steps.refs.outputs.issues != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          ISSUES: ${{ steps.refs.outputs.issues }}
        with:
          script: |
            const version = context.ref.replace(/^refs\/tags\/v/, '');
            const marker = `<!-- bebop:release-report v${version} -->`;
            for (const number of (process.env.ISSUES ?? '').split(/\s+/).filter(Boolean).map(Number)) {
              let issue;
              try { ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number })); }
              catch (error) { core.warning(`#${number}: ${error.message}`); continue; }
              if (issue.pull_request || issue.state !== 'open') continue;
              const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: number, per_page: 100 });
              if (comments.some(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker))) continue;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: [marker, `@agent-bebop v${version} has been released and includes commits that reference this issue. Please verify the release and report back here.`].join('\n\n')
              });
            }
