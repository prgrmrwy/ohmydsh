name: ✨ 功能建议 / Feature Request
description: 提出新能力或行为改进 / Suggest a new capability or improvement
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法!

        本仓库是 **规范驱动(OpenSpec)** 的:较大的行为变化通常会先落成一个 change
        (`proposal.md` / `design.md` / `specs/` / `tasks.md`),再进入实现。
        这个 Issue 就是那份提案的起点。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 和 `BACKLOG.md`,确认这不是重复建议
          required: true
        - label: 我已确认 `openspec/changes/` 中没有正在推进的相关 change
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 请描述动机与场景,而不是直接给方案。什么情况下会遇到痛点?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 你希望系统表现成什么样?如涉及 `dsh.yaml`,请给出配置片段示例。
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: 大致属于哪类改动
      options:
        - 新增自研 package(local customization)
        - 接入第三方插件(remote customization)
        - 启动器 / CLI 行为
        - sync 物化行为
        - 新增 skill / preset
        - 文档 / 工程化
        - 不清楚
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有现成的变通做法?为什么不够用?

  - type: textarea
    id: risks
    attributes:
      label: 风险与兼容性
      description: |
        是否影响幂等性、安全边界、现有 spec 或既有部署?
        是否引入新的第三方信任面?
