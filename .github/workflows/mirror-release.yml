name: Mirror release

# Self-developed plugins published as standalone repositories are mirrored from
# this monorepo with `git subtree split`, and kept in sync both ways: PRs may be
# merged on a mirror as on any standalone repository. Each run, per mirror,
# scripts/mirror-sync.mjs merges mirror commits this repository does not have
# back into the package directory, pushes that merge to main here, then splits
# reusing the mirror's own commits (`--onto`) and fast-forwards the mirror's
# main. When the mirror has no `v<package version>` tag yet, it creates one;
# the tag starts the mirror's own release.yml, which tests and publishes to npm
# through trusted publishing and skips versions already on npm.
#
# The first run per mirror joins the two histories once with an `-s ours`
# merge (no file changes). A merge-back conflict, or a mirror that diverged
# before that join, fails this job without pushing anything: merge it by hand
# here (`git merge -Xsubtree=packages/<dir> <mirror main>`) and rerun.
#
# Runs on pushes to main touching a mirrored package, hourly (to pick up PRs
# merged on mirrors), and on dispatch. Pushes made with GITHUB_TOKEN start no
# new workflow runs, so the merge-back push does not loop.
#
# Each mirror has its own write deploy key; the private half is the secret named
# in the matrix. force=true is the one sanctioned history rewrite: after
# renaming a mirrored package directory `git subtree split` produces unrelated
# history, so dispatch once with force to replace the mirror's main (skipping
# merge-back). Release tags stay where they are.

on:
  push:
    branches: [main]
    paths:
      - 'packages/dsh-auto-model-routing/**'
      - 'packages/dsh-magpie-connector/**'
      - 'packages/dsh-sidebar-session-provider-icon/**'
      - 'packages/dsh-session-id-copy/**'
      - 'packages/cockpit-worktree-open-shim/**'
      - 'packages/cockpit-memex-browse-shim/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rewrite the mirror main history (one-off, after renaming a mirrored package directory)'
        type: boolean
        default: false

concurrency:
  group: mirror-release
  cancel-in-progress: false

permissions:
  # Merge-back commits are pushed to this repository's main.
  contents: write

jobs:
  mirror:
    name: Mirror ${{ matrix.repo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Mirrors run one after another: each may push a merge-back commit to main,
      # and the next one starts from that new main.
      max-parallel: 1
      matrix:
        include:
          - dir: dsh-auto-model-routing
            repo: dsh-auto-model-routing
            secret: MIRROR_KEY_AUTO_MODEL_ROUTING
          - dir: dsh-magpie-connector
            repo: dsh-magpie-connector
            secret: MIRROR_KEY_MAGPIE_CONNECTOR
          - dir: dsh-sidebar-session-provider-icon
            repo: dsh-sidebar-session-provider-icon
            secret: MIRROR_KEY_SIDEBAR_PROVIDER_ICON
          - dir: dsh-session-id-copy
            repo: dsh-session-id-copy
            secret: MIRROR_KEY_SESSION_ID_COPY
          - dir: cockpit-worktree-open-shim
            repo: dsh-cockpit-worktree-open-shim
            secret: MIRROR_KEY_COCKPIT_WORKTREE_OPEN_SHIM
          - dir: cockpit-memex-browse-shim
            repo: dsh-cockpit-memex-browse-shim
            secret: MIRROR_KEY_COCKPIT_MEMEX_BROWSE_SHIM
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure deploy key
        env:
          KEY: ${{ secrets[matrix.secret] }}
        run: |
          test -n "$KEY" || { echo "::error::secret ${{ matrix.secret }} is not set"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/mirror && chmod 600 ~/.ssh/mirror
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Sync both ways
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Start from the newest main: an earlier matrix job may have pushed a merge-back.
          git fetch --no-tags origin main
          git checkout -B main origin/main
          node scripts/mirror-sync.mjs --prefix "packages/${{ matrix.dir }}" \
            --mirror "git@github.com:prgrmrwy/${{ matrix.repo }}.git" --push-origin \
            ${{ inputs.force && '--force' || '' }}

      - name: Tag new version
        run: |
          remote="git@github.com:prgrmrwy/${{ matrix.repo }}.git"
          split="${{ steps.sync.outputs.split }}"
          version="$(git show "$split:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          if git ls-remote --exit-code --tags "$remote" "refs/tags/v$version" >/dev/null; then
            echo "v$version already tagged on the mirror; nothing to release."
          else
            git tag -a "v$version" "$split" -m "v$version"
            git push "$remote" "refs/tags/v$version"
            echo "Tagged v$version; the mirror's release workflow publishes it."
          fi
