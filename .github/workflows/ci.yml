name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新 push 取消尚未完成的旧运行,节省 Actions 额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 根 package-lock.json 是唯一 lock 源;用 ci 保证可复现安装。
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  artifacts:
    name: Tracked artifact policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 防止生成产物、nested lock、raw evidence 或重复架构图进入 Git。
      - name: Check tracked artifacts
        run: npm run check:artifacts

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bin/dsh 与 scripts/*.sh 是安装与启动的关键路径,静态检查成本低收益高。
      - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=error bin/dsh scripts/*.sh
