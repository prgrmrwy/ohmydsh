name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新 push 取消尚未完成的旧运行,节省 Actions 额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 根 package-lock.json 是唯一 lock 源;用 ci 保证可复现安装。
      - name: Install dependencies
        run: npm ci

      # dsh-openspec 的 lib/ 是 gitignore 的构建产物,tests/dsh-openspec-upgrade
      # 直接 import 它;不先构建,干净 checkout 里这些用例会 ERR_MODULE_NOT_FOUND。
      - name: Build dsh-openspec
        run: npm run build --workspace dsh-openspec

      - name: Run POSIX complete regression suite
        if: runner.os != 'Windows'
        run: npm test

      # Native Win32 contract lane deliberately does not use Git Bash, including
      # the Windows System32 WSL bash shim. Full repo build gate is separate.
      - name: Run native Windows contracts without Bash
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'ohmydsh-native-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item "$env:SystemRoot\System32\taskkill.exe" $tools
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $tools
          Copy-Item "$env:SystemRoot\System32\where.exe" $tools
          $nodeDir = Split-Path (Get-Command node.exe).Source
          $gitDir = Split-Path (Get-Command git.exe).Source
          $env:PATH = "$tools;$nodeDir;$gitDir;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          if (Get-Command bash,sh -ErrorAction SilentlyContinue) { throw 'Bash leaked into native lane' }
          node --test tests/package-manager.test.mjs tests/launcher-bootstrap.test.mjs tests/launcher-exec.test.mjs tests/launcher-args.test.mjs tests/launcher-env-local.test.mjs tests/launcher-environment.test.mjs tests/launcher-process.test.mjs tests/launcher-ui.test.mjs tests/launcher-runner.test.mjs tests/launcher-lifecycle.test.mjs tests/workspace-lifecycle.test.mjs tests/launcher-install.test.mjs tests/launcher-acceptance.test.mjs tests/platform/windows-launcher.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run macOS platform contracts
        if: runner.os == 'macOS'
        run: node --test tests/platform/darwin-launcher.test.mjs

  artifacts:
    name: Tracked artifact policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 防止生成产物、nested lock、raw evidence 或重复架构图进入 Git。
      - name: Check tracked artifacts
        run: npm run check:artifacts

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bin/dsh 与 scripts/*.sh 是安装与启动的关键路径,静态检查成本低收益高。
      - name: Run ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=error bin/dsh scripts/*.sh
